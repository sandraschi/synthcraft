[workspace]
members = [
    "crates/synthcraft-core",
    "crates/synthcraft-mcp",
    "crates/synthcraft-ffi",
    "crates/synthcraft-clap",
    "crates/synthcraft-app",
]
exclude = ["xtask"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Sandra Schipal <sandra@sandraschi.dev>"]
repository = "https://github.com/sandraschi/synthcraft"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.37"
egui = "0.37"
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
rusqlite = { version = "0.41", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
