<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SynthCraft DSP</title>
<style>
:root {
  color-scheme: light dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--color-background-primary, #111318);
  color: var(--color-text-primary, #e8ecf1);
  font-family: var(--font-sans, system-ui, -apple-system, Segoe UI, sans-serif);
  font-size: 13px;
  line-height: 1.45;
}
.shell { padding: 14px; max-width: 1200px; margin: 0 auto; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
  padding-bottom: 10px; border-bottom: 1px solid var(--color-border-primary, #2a2f3a);
}
.brand { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge {
  font-weight: 700; letter-spacing: 0.08em; font-size: 11px;
  padding: 3px 8px; border-radius: 6px;
  background: var(--color-background-info, #1d3557);
  color: var(--color-text-info, #90caf9);
}
.ver { font-weight: 600; font-size: 12px; }
.muted { color: var(--color-text-secondary, #9aa4b2); }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; }
.actions { display: flex; gap: 8px; }
.btn {
  cursor: pointer; border-radius: 6px; padding: 6px 11px; font-size: 12px; font-weight: 500;
  border: 1px solid var(--color-border-primary, #2e3440);
  background: var(--color-background-secondary, #1a1e26);
  color: var(--color-text-primary, #e8ecf1);
}
.btn:hover:not(:disabled) { border-color: var(--color-ring-primary, #5b8def); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary {
  background: var(--color-background-info, #1f4b99);
  border-color: var(--color-border-info, #3b82f6);
  color: var(--color-text-inverse, #ffffff);
}
.btn-sm { padding: 3px 8px; font-size: 11px; }
.notice {
  margin-bottom: 10px; padding: 8px 10px; border-radius: 6px; font-size: 12px;
  background: var(--color-background-secondary, #1a1e26);
  border: 1px solid var(--color-border-info, #3b82f6);
}
.kpis {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
  gap: 8px; margin-bottom: 12px;
}
.kpi {
  background: var(--color-background-secondary, #171a21);
  border: 1px solid var(--color-border-primary, #282d38);
  border-radius: 8px; padding: 9px 11px;
}
.kpi-label { font-size: 11px; color: var(--color-text-secondary, #9aa4b2); }
.kpi-val { font-size: 18px; font-weight: 700; margin-top: 2px; }
.kpi-val .sub { font-size: 11px; font-weight: 400; color: var(--color-text-secondary, #9aa4b2); }
.warn { color: var(--color-text-warning, #f59e0b); }
.danger { color: var(--color-text-danger, #ef4444); }
.ok { color: var(--color-text-success, #22c55e); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; border-bottom: 1px solid var(--color-border-primary, #282d38); }
.tab {
  cursor: pointer; background: transparent; border: none; padding: 7px 12px;
  color: var(--color-text-secondary, #9aa4b2); font-weight: 600; font-size: 12px;
  border-bottom: 2px solid transparent;
}
.tab.active {
  color: var(--color-text-primary, #e8ecf1);
  border-bottom-color: var(--color-ring-primary, #3b82f6);
}
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.input {
  flex: 1; min-width: 180px; padding: 6px 10px; border-radius: 6px; font-size: 12px;
  border: 1px solid var(--color-border-primary, #2e3440);
  background: var(--color-background-secondary, #171a21);
  color: var(--color-text-primary, #e8ecf1);
}
.pills { display: flex; gap: 4px; flex-wrap: wrap; }
.pill {
  cursor: pointer; padding: 4px 9px; border-radius: 999px; font-size: 11px;
  border: 1px solid var(--color-border-primary, #2e3440);
  background: var(--color-background-secondary, #171a21);
  color: var(--color-text-secondary, #9aa4b2);
}
.pill.active {
  background: var(--color-background-info, #1f4b99);
  color: var(--color-text-inverse, #ffffff);
  border-color: var(--color-border-info, #3b82f6);
}
.hint {
  margin-bottom: 10px; padding: 7px 10px; border-radius: 6px; font-size: 12px;
  background: var(--color-background-tertiary, #1c2029);
  color: var(--color-text-secondary, #9aa4b2);
}
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.card {
  background: var(--color-background-secondary, #171a21);
  border: 1px solid var(--color-border-primary, #282d38);
  border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px;
}
.card-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tag, .col-tag, .holder-tag {
  font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px;
  background: var(--color-background-tertiary, #232834);
  color: var(--color-text-primary, #e8ecf1);
}
.holder-tag { background: var(--color-background-info, #1d3557); color: var(--color-text-info, #90caf9); }
.card-title { font-weight: 600; font-size: 13px; word-break: break-word; }
.card-detail { font-size: 11px; word-break: break-word; }
.card-actions { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
.list { display: flex; flex-direction: column; gap: 6px; }
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 10px; border-radius: 6px;
  background: var(--color-background-secondary, #171a21);
  border: 1px solid var(--color-border-primary, #282d38);
}
.section-title { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-secondary, #9aa4b2); }
.empty { padding: 18px; text-align: center; color: var(--color-text-secondary, #9aa4b2); }
.pre {
  background: var(--color-background-secondary, #171a21);
  border: 1px solid var(--color-border-primary, #282d38);
  border-radius: 6px; padding: 10px; overflow: auto; max-height: 280px;
  font-family: ui-monospace, Consolas, monospace; font-size: 11px;
}
</style>
</head>
