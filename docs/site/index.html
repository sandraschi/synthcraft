<script>
const WORKBENCHES = [{"file": "01_modular_rack.md", "id": "01_modular_rack", "title": "Workbench 1: VCV 2 Eurorack & VCO/VCF", "intro": "Welcome to the heart of SynthCraft: a tactile, cable-patched 3U modular synthesizer rack paired with a classic dual-oscillator analog voice and resonant ladder filter. Think of this workbench as having both a wall of patchable studio hardware and a complete library of instant-recall presets at your fingertips.", "subpages": [{"id": "subpage-1-1-vcv-3u-eurorack-patch-cables", "title": "Subpage 1.1: VCV 3U Eurorack & Patch Cables", "body": "### What It Does (Plain English)\nInstead of locking you into one fixed signal path, the 3U Eurorack bay lets you wire individual sound modules together with virtual patch cables that drape across the panel with realistic gravity. Sound starts at an oscillator (a tone generator), gets sculpted by a filter (which brightens or darkens the tone), and can be folded, delayed, modulated, or even routed through an external third-party CLAP plugin living right inside the rack.\n\n### Controls & Workflow\n- **Add, Move, Bypass, or Remove Modules**: Click `+ Add Module` to browse all 13 playable 3U modules -- Dual Oscillator, 4-Pole Ladder Filter, Envelope Generator, Low-Frequency Oscillator, Wavefolder + Low-Pass Gate, Sample & Hold + Slew Limiter, Stereo Ping-Pong Delay, Euclidean Clock Generator, Dual Attenuverter, Inline 3U Oscilloscope, and the 16 HP **CLAP Host** slot for loading external `.clap` plugins. Right-click any module faceplate to move, bypass, or remove it.\n- **Drag Patch Cables**: Click and drag from any output jack to any input jack. Moving a cable or unplugging it updates the audio routing live without audio dropouts.\n- **12 Pre-Patched Rack Rigs**: Not sure where to plug your first cable? Pick one of the 12 curated Rack Rigs from the dropdown (such as West-Coast Buchla Pluck, Acid Squelch, or Dub Ping-Pong) to wire up an entire modular patch in one click.\n- **Dual Oscillators & 4-Pole Ladder Filter**: Shape the core voice using 10 waveforms (including classic analog saw, square, pulse-width modulation, supersaw, and morphing wavetables), fine detuning in cents, linear frequency modulation between oscillators, and a 4-mode resonant filter (24 dB/oct Low-Pass, 12 dB/oct Band-Pass, 12 dB/oct High-Pass, and Acid Resonant).\n- **Knob Gestures**: Drag vertically to adjust, hold `Shift` for fine precision, scroll the mouse wheel, or double-click any knob to reset it to its default value.\n\n### Provenance, Hardware Lineage & History\n- **3U Eurorack Format (Doepfer A-100, 1995)**: Dieter Doepfer standardized the 3U (128.5 mm tall) horizontal-pitch (`HP`) modular rack standard in Munich in 1995, democratizing modular synthesis that previously cost as much as a luxury car.\n- **24 dB/Octave Transistor Ladder Filter (Moog Minimoog Model D, 1970)**: Robert Moog's patented four-stage ladder filter gave analog synthesizers their unmistakable warm, creamy roll-off and singing self-oscillation at high resonance.\n- **Wavefolder & Low-Pass Gate (Buchla 259 & 292, 1970s)**: On the US West Coast, Don Buchla took the opposite approach from East Coast subtractive filtering: start with a pure sine wave, fold it back on itself to create rich metallic harmonics, and gate it through a light-sensitive vactrol (\"Low-Pass Gate\") that decays like a struck wooden marimba or bongo.\n- **Sample & Hold + Slew (ARP 2600, 1971)**: Classic stepped random voltage modulation smoothed into gliding melodic lines.\n\n### Famous Tracks & Iconic Usage\n- **Donna Summer -- \"I Feel Love\" (1977, produced by Giorgio Moroder)**: Driven by a Moog Modular sequenced bassline and resonant ladder filter sweeps that invented modern electronic dance music.\n- **Kraftwerk -- \"Autobahn\" (1974)**: Showcased the Minimoog's singing ladder filter lead and modulated oscillator sweeps.\n- **Morton Subotnick -- \"Silver Apples of the Moon\" (1967)**: The landmark album recorded entirely on Don Buchla's West-Coast modular system, demonstrating organic vactrol percussion and folded timbres.\n- **The Who -- \"Won't Get Fooled Again\" (1971)**: Classic ARP 2500 / 2600 modular sample-and-hold filter rhythmic gating.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp update-oscillators --vco1 Saw --vco2 SuperSaw --detune-cents 12 --mix 0.55 --fm 0.15\nsynthcraft-mcp update-filter --mode LowPass24dB --cutoff-hz 1200 --resonance 0.65 --env-mod 0.45\nsynthcraft-mcp list-rack-presets\nsynthcraft-mcp load-rack-preset --id west_coast_vactrol\n```\n\n---"}, {"id": "subpage-1-2-factory-patch-bank-overview", "title": "Subpage 1.2: Factory Patch Bank Overview", "body": "### What It Does (Plain English)\nThis page is your studio preset browser and librarian. It displays all factory and custom user patches stored in SynthCraft's local SQLite database (`%LOCALAPPDATA%\\synthcraft\\synthcraft.db`), showing each patch's musical tempo (BPM), Camelot harmonic key (for DJ mixing), active synthesis engines, and quick audition buttons.\n\n### Controls & Workflow\n- **Instant Patch Recall**: Click any patch card -- or use the always-visible `< [Patch] >` arrows in the top studio header -- to switch patches immediately without interrupting playback.\n- **A/B Patch Compare & 64-Deep Undo/Redo**: Experiment boldly with knobs, press `Ctrl+Z` / `Ctrl+Y` to step backward or forward up to 64 edits, or toggle A/B compare to audition your edited sound against the original preset.\n- **Factory Reset**: Restore the built-in factory patches (`vienna_acid_303`, `goliath_reese_sub`, `danube_dub_chord`, `stephansdom_bell_fm`, `djcraft_riser_sweep`, `soundcraft_warm_pad`) at any time.\n\n### Provenance, Hardware Lineage & History\n- **Digital Patch Memory (Sequential Circuits Prophet-5, 1978)**: Before Dave Smith and John Bowen introduced the microprocessor-controlled Prophet-5 in 1978, musicians had to draw knob positions on paper patch sheets between songs. SynthCraft pairs that instant-recall convenience with full JSON serialization and transactional SQLite backups.\n- **Reese Bass Heritage (`goliath_reese_sub`)**: Named after Kevin Saunderson's 1988 Detroit techno track \"Just Want Another Chance\" (released under the alias *Reese*), created by detuning two sawtooth oscillators on a Casio CZ-5000 / analog synth until their phases beat against each other into a thick, snarling bassline.\n\n### Famous Tracks & Iconic Usage\n- **Reese (Kevin Saunderson) -- \"Just Want Another Chance\" (1988)** & **Noisia / Chase & Status**: The blueprint for the detuned `goliath_reese_sub` bass heard across drum & bass, UK garage, and neurofunk.\n- **Basic Channel -- \"Phylyps Trak\" (1993)**: The hypnotic filtered minor-chord dub techno sound behind `danube_dub_chord`.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp list-patches --json\nsynthcraft-mcp load-patch --id vienna_acid_303\nsynthcraft-mcp reset-factory\n```"}]}, {"file": "02_m1_extreme_dsp.md", "id": "02_m1_extreme_dsp", "title": "Workbench 2: 1990-Style PCM & Extreme DSP", "intro": "This workbench pairs two wildly different eras of sound design side by side: the unmistakable punchy digital workstation keyboards that defined 1988-1995 club and pop music, and six cutting-edge mathematical synthesis engines that create plucked strings, crystalline clouds, metallic bars, and West-Coast timbres from scratch.", "subpages": [{"id": "subpage-2-1-1990-pcm-workstation-rompler", "title": "Subpage 2.1: 1990 PCM Workstation Rompler", "body": "### What It Does (Plain English)\nIn the late 1980s, a new generation of keyboard workstations replaced analog oscillators with short digital recordings (\"PCM samples\") stored in ROM chips, played back through gritty 12-to-16-bit digital-to-analog converters at 32 kHz. Because memory was tiny, engineers combined a bright attack transient (like a piano hammer strike or organ key-click) with a short looped body -- producing sounds that cut through club sound systems like nothing before or since. SynthCraft recreates this dual-layer \"Combi\" workstation architecture with 8 classic programs plus loadable CC0 sample banks (including harpsichords/cembalos and cathedral pipe organs).\n\n### Controls & Workflow\n- **Choose a Program**: Pick from the 8 classic workstation programs (`Universe`, `Piano 16'`, `Organ 2`, `Fretless Bass`, `Slap Bass`, `Pan Flute`, `Ooh/Aah Choir`, `Orchestra Hit`) and blend them with your analog oscillators using the **PCM Mix** knob.\n- **Dual-Layer AI2 Combi Stacking**: Layer two contrasting programs together (for example, a bright percussive attack layer under a lush choir pad) with independent volume and detune.\n- **1988 32 kHz / 12-Bit DAC Mode**: Toggle the vintage converter emulation to add subtle aliasing sparkle and mid-range grit that makes house pianos and basslines jump out of a dense mix.\n- **Load Custom Sample Banks**: Drop in your own `.wav`, `.sfz`, or `.sf2` SoundFont libraries, or fetch checksum-verified CC0 packs (`vsco2ce-cello-section-sus`, cembalos, pipe organs) with one click.\n\n### Provenance, Hardware Lineage & History\n- **Korg M1 (1988)**: The best-selling hardware synthesizer of its era. Its \"AI Synthesis\" combined 4 MB of 16-bit PCM samples with onboard digital effects and a sequencer. Program 00 (*Universe*), Program 01 (*Piano 16'*), and Program 17 (*Organ 2*) became the defining sonic signatures of 1990s house, rave, and pop.\n- **Fairlight CMI (1979) & E-mu Emulator II (1984)**: Pioneered the \"Orchestra Hit\" (originally sampled from Stravinsky's *The Firebird*) and breathy pan-flute / vocal choir patches.\n\n### Famous Tracks & Iconic Usage\n- **Robin S. -- \"Show Me Love\" (1993)**: One of the most recognizable basslines in dance music history -- played straight off the Korg M1's **Organ 2** preset (`m1_17_organ2`).\n- **Madonna -- \"Vogue\" (1990)** & **Black Box -- \"Ride on Time\" (1989)**: Driven by the punchy, bright **M1 House Piano (`m1_01_piano16`)** cutting through club mixes.\n- **Enigma -- \"Sadeness (Part I)\" (1990)** & **Peter Gabriel -- \"Sledgehammer\" (1986)**: Iconic use of breathy **Pan Flute** (`m1_24_panflute`) and **Ooh/Aah Choir** (`m1_36_choir`) textures.\n- **Yes -- \"Owner of a Lonely Heart\" (1983)** & **Afrika Bambaataa -- \"Planet Rock\" (1982)**: Made the **Orchestra Hit** (`m1_48_orchhit`) an eternal hip-hop and pop staple.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp load-m1 --program m1_17_organ2 --mix 0.85\nsynthcraft-mcp list-banks\nsynthcraft-mcp fetch-bank vsco2ce-cello-section-sus\n```\n\n---"}, {"id": "subpage-2-2-extreme-modern-dsp-engine", "title": "Subpage 2.2: Extreme Modern DSP Engine", "body": "### What It Does (Plain English)\nInstead of relying on traditional oscillators or recorded samples, the Extreme DSP engine generates audio directly from physics and non-linear mathematics. One single **Morph / Harmonics** macro lets you twist each algorithm from delicate acoustic realism into futuristic electronic textures.\n\n### Controls & Workflow\nSelect one of 6 algorithms and sweep the **Extreme Morph** and **Mix** controls:\n- **Karplus-Strong Pluck**: Models a vibrating guitar, harp, or koto string by sending a tiny burst of noise into a tuned feedback delay line with realistic high-frequency damping.\n- **Granular Cloud**: Chops audio into overlapping micro-grains windowed with smooth bell curves, adding +1 octave and +5th shimmer harmonics.\n- **Wavetable Morph**: Smoothly glides through a 3D stack of single-cycle waves (from pure Sine to Vocal Formant, Digital Fold, and HyperSaw).\n- **West-Coast Wavefolder**: Pushes a smooth sine wave through a 5-stage trigonometric folder paired with a vactrol Low-Pass Gate for woody, rubbery, percussive tones.\n- **Phase Distortion (CZ-Style)**: Warps the playback speed of a cosine wave within each single cycle to mimic resonant analog filter sweeps without using a filter at all.\n- **Modal Struck Bar**: Resonates a bank of mathematical bar modes (`1.0, 2.756, 5.404, 8.933`) derived from the Euler-Bernoulli beam equation to synthesize marimbas, glockenspiels, vibraphones, and glass bells.\n\n### Provenance, Hardware Lineage & History\n- **Karplus-Strong Algorithm (Kevin Karplus & Alex Strong, Stanford CCRMA, 1983)**: A breakthrough in physical modeling that proved a simple filtered delay loop could sound astonishingly like a plucked acoustic string.\n- **Casio CZ-101 Phase Distortion (1984)**: Casio's ingenious digital alternative to Yamaha's patented FM synthesis -- beloved for warm, hollow basses and glassy pads.\n- **PPG Wave 2.2 (1982) & Waldorf Microwave (1989)**: Wolfgang Palm invented wavetable synthesis in Germany, allowing digital oscillators to sweep continuously between radically different timbres.\n- **Mutable Instruments Rings / Plaits (Emilie Gillet, 2015-2018)**: Brought modal resonators and compact West-Coast wavefolders into modern Eurorack studios worldwide.\n\n### Famous Tracks & Iconic Usage\n- **Depeche Mode -- \"Just Can't Get Enough\" / A-ha & Tears for Fears (1980s)**: PPG Wave wavetable pads and crisp digital sweeps.\n- **Vince Clarke (Erasure) & early UK Techno**: Heavy users of the Casio CZ-101's snappy Phase Distortion basses.\n- **Four Tet & Jon Hopkins**: Modern electronic producers celebrated for shimmering granular clouds, Karplus-Strong plucks, and Mutable-style modal percussion.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp set-extreme-dsp --mode karplus_strong_pluck --morph 0.6 --mix 0.75\nsynthcraft-mcp set-extreme-dsp --mode modal_struck_bar --morph 0.45 --mix 0.8\n```"}]}, {"file": "03_midi_depot.md", "id": "03_midi_depot", "title": "Workbench 3: MIDI Keyboard & MIDI Depot", "intro": "Whether you have a full-size studio keyboard plugged into your computer or you are designing patches on a laptop with just a mouse, this workbench connects your hands and your MIDI library directly to SynthCraft's live polyphonic audio engine.", "subpages": [{"id": "subpage-3-1-midi-keyboard-25-key-piano", "title": "Subpage 3.1: MIDI Keyboard & 25-Key Piano", "body": "### What It Does (Plain English)\nThis page handles live musical input. It automatically discovers USB and 5-pin DIN MIDI keyboards connected to your PC via Windows MIDI (`midir`), maps your hardware knobs and mod wheel directly to SynthCraft's filter and envelope controls, and gives you a clickable 25-key (2-octave, `C3` to `C5`) studio piano right on screen for instant auditioning.\n\n### Controls & Workflow\n- **Connect Hardware**: Plug in any class-compliant USB MIDI controller (Arturia KeyStep/MiniLab, Akai MPK, Korg nanoKEY, Novation Launchkey, Native Instruments Komplete Kontrol). Select it from the **MIDI Input Device** dropdown, or leave it on `Auto-Detect / Omni` to listen on all 16 channels.\n- **Automatic Hardware Knob Mapping**: Your controller's standard MIDI Continuous Controllers (CCs) work out of the box:\n  - `CC 1` (Mod Wheel) -> LFO Filter Modulation Depth\n  - `CC 74` (Brightness) -> 4-Pole Ladder Filter Cutoff Frequency\n  - `CC 71` (Timbre) -> Filter Resonance\n  - `CC 73` (Attack) -> Envelope Attack Time\n  - `CC 91` (FX Depth) -> Extreme DSP Morph Macro\n- **On-Screen Piano & Computer Keyboard**: Click or drag across the 25 keys on screen, or arm **Live Rec** in the transport bar to record what you play directly into the 64-step sequencer.\n\n### Provenance, Hardware Lineage & History\n- **MIDI 1.0 Specification (Dave Smith & Ikutaro Kakehashi, NAMM 1983)**: In one of music technology's greatest moments of cooperation, Sequential Circuits (US) and Roland (Japan) connected a Prophet-600 to a Roland Jupiter-6 with a single 5-pin cable at the 1983 NAMM show, creating the universal language that every synthesizer and DAW still speaks over 40 years later.\n\n### Famous Tracks & Iconic Usage\n- **Herbie Hancock -- \"Rockit\" (1983)**: One of the earliest mainstream showcases of interconnected digital keyboards and sequenced MIDI-era studio rigs.\n- **Jean-Michel Jarre -- \"Rendez-Vous\" (1986)**: Massive multi-synthesizer live rigs linked together via MIDI controllers and sequencers.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp record-sequencer-notes --notes \"36,36,48,36,43,41,39,36\"\n```\n\n---"}, {"id": "subpage-3-2-midi-pattern-depot-mid-export", "title": "Subpage 3.2: MIDI Pattern Depot & .MID Export", "body": "### What It Does (Plain English)\nBlank sequencer grids can be intimidating when you just want to test how a new bass, piano, or marimba patch grooves. The MIDI Pattern Depot bundles 8 genre-authentic musical patterns that you can load into SynthCraft's sequencer in one click -- or export as standard `.mid` files (480 pulses per quarter note) to drag straight into REAPER, SoundCraft, Ableton Live, or FL Studio.\n\n### Controls & Workflow\n- **Browse & Load Patterns**: Pick from 8 built-in patterns:\n  1. *1990 Ibiza Rave Piano* (syncopated house chords)\n  2. *Club Organ 2 Bass* (bouncy UK garage / house bassline)\n  3. *Vienna 303 Acid* (accented, sliding 16th-note acid squelch)\n  4. *Universe Pad* (wide atmospheric progression)\n  5. *Wavefolder Polyrhythm* (West-Coast percussive ostinato)\n  6. *Karplus Harp* (flowing arpeggiated plucked line)\n  7. *Modal Marimba* (mallet percussion pattern)\n  8. *Neuro Reese* (sustained pitch-gliding sub bass)\n- **Export & Import Standard MIDI Files (`.mid`)**: Save any pattern to disk as a Format 0/1 `.mid` file, or import any `.mid` melody from your hard drive directly into SynthCraft's sequencer (preserving notes, velocities, accents, legato slides, and BPM).\n\n### Provenance, Hardware Lineage & History\n- **Standard MIDI File Format (Dave Oppenheim / Opcode Systems, 1988)**: Created so musicians could trade musical scores and grooves between different sequencers and operating systems without losing timing, velocity, or tempo metadata.\n\n### Famous Tracks & Iconic Usage\n- **Phuture -- \"Acid Tracks\" (1987)**: The hypnotic, looping 16-step pattern with accents and slides that inspired the *Vienna 303 Acid* depot clip.\n- **Robin S. -- \"Show Me Love\" (1993)** & **Crystal Waters -- \"Gypsy Woman\" (1991)**: The classic bouncy house piano and organ grooves echoed in the *Ibiza Rave Piano* and *Club Organ 2 Bass* patterns.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp load-midi-clip --id vienna_303_acid\nsynthcraft-mcp export-midi --clip-id ibiza_rave_piano --path ibiza_piano.mid\nsynthcraft-mcp import-midi-file --path my_melody.mid\n```"}]}, {"file": "04_demo_showcase.md", "id": "04_demo_showcase", "title": "Workbench 4: Demo Showcase & Audition", "intro": "Think of this workbench as the showroom floor of a vintage-meets-futuristic synthesizer museum. Every card configures an entire sound design recipe -- oscillators, filter, PCM layer, Extreme DSP, modulation, and musical pattern -- and lets you hear and inspect it with a single click.", "subpages": [{"id": "subpage-4-1-1-click-pcm-acid-west-coast-demos", "title": "Subpage 4.1: 1-Click PCM / Acid / West-Coast Demos", "body": "### What It Does (Plain English)\nWhen you open SynthCraft for the first time (or want quick inspiration for a track), you do not need to dial in 40 knobs by hand. The Demo Showcase provides 6 curated one-click sound demonstrations spanning 1980s Chicago acid, 1990s Ibiza house, West-Coast Buchla percussion, physical plucked strings, modal marimbas, and modern drum & bass Reese subs. Clicking a card loads the patch, runs a short synthesis render, and displays live loudness and spectral metrics.\n\n### Controls & Workflow\n- **Audition Any Showcase**: Click a showcase card to immediately configure SynthCraft's engine and hear the characteristic sound in context.\n- **Inspect Under the Hood**: After clicking a demo card, switch to Workbench 1 (Modular Rack), Workbench 2 (PCM & Extreme DSP), or Workbench 5 (Sequencer) to see exactly how the sound was built and start tweaking it into your own signature patch.\n- **Spectral Feedback**: Each demo reports its RMS loudness, Peak dBFS, and detected fundamental frequency so you can compare headroom and tonal balance across genres.\n\n### Provenance, Hardware Lineage & History\n- **Hardware Demo Modes (Roland D-50, Korg M1, Yamaha DX7, 1983-1988)**: Classic flagship synthesizers always shipped with a dedicated \"Demo\" button so musicians walking into a music store could instantly hear the full range of the instrument -- from crystalline bells to punchy basslines and sweeping pads -- before touching a single edit menu.\n\n### Famous Tracks & Iconic Usage\n- **Chicago Acid House (`vienna_acid_303`)**: Echoes Josh Wink's *\"Higher State of Consciousness\"* (1995) and Fatboy Slim's *\"Everybody Needs a 303\"* (1996).\n- **1990s Ibiza House Piano & Organ (`ibiza_rave_piano`)**: Channels Frankie Knuckles, Robert Miles (*\"Children\"*, 1996), and Robin S. (*\"Show Me Love\"*, 1993).\n- **West-Coast Modular (`west_coast_wavefolder`)**: Pays tribute to Suzanne Ciani (*\"Seven Waves\"*, 1982) and Alessandro Cortini's Buchla performances.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp run-demo --id vienna_acid_303 --json\nsynthcraft-mcp run-demo --id west_coast_buchla --json\n```"}]}, {"file": "05_sequencer_env.md", "id": "05_sequencer_env", "title": "Workbench 5: Sequencer, Drums & ADSR/LFO", "intro": "This workbench is your rhythm and movement command center. It combines a 4-bar (64-step) acid step sequencer, a complete 8-voice pure-Rust analog/FM drum machine inspired by the legendary Roland TR-808 and TR-909, and the envelope, LFO, modulation matrix, arpeggiator, and microtonal tuning controls that bring static tones to life.", "subpages": [{"id": "subpage-5-1-64-step-acid-sequencer-4-bars", "title": "Subpage 5.1: 64-Step Acid Sequencer (4 Bars)", "body": "### What It Does (Plain English)\nA step sequencer plays a repeating grid of musical notes locked tightly to your project tempo. While classic acid boxes stopped at 16 steps (one single bar), SynthCraft expands seamlessly to **16, 32, 48, or 64 steps (4 full bars)** with a clean `Bar A / B / C / D` pager -- so you can write evolving basslines, chord progressions, and melodic turnarounds without repeating every 2 seconds.\n\n### Controls & Workflow\n- **Length & Bar Pager**: Click `16`, `32`, `48`, or `64` steps to set the loop length, and flip between `Bar A` (steps 1-16), `Bar B` (17-32), `Bar C` (33-48), and `Bar D` (49-64).\n- **Per-Step Acid Controls**: Every step has a toggle switch, MIDI pitch (`C2` to `C6`), velocity, gate length, **Accent** (which boosts both volume and filter bite), and **Slide** (which glides smoothly in pitch into the next note like a real TB-303).\n- **Live Record (`Rec`)**: Arm `Rec` in the transport bar to overdub notes live from your USB MIDI keyboard or on-screen piano while the loop plays, or step-record one note at a time when stopped.\n\n### Provenance, Hardware Lineage & History\n- **Roland TB-303 Bass Line (Tadao Kikumoto, 1981)**: Originally designed to replace human bass guitarists for solo lounge musicians, the TB-303 was a commercial flop -- until Chicago producers like DJ Pierre (Phuture) bought them for \\$50 in pawn shops, cranked the resonance and accent knobs, and accidentally invented **Acid House**. The secret to the 303's hypnotic \"squelch\" is the interaction between its accent circuit (which briefly narrows filter decay and punches the envelope) and its fixed-time pitch slide.\n\n### Famous Tracks & Iconic Usage\n- **Phuture -- \"Acid Tracks\" (1987)**: The ground-zero Chicago Acid House record built around a single 16-step TB-303 pattern twisted live for 12 minutes.\n- **Daft Punk -- \"Da Funk\" (1995)**: An iconic snarling, accented acid riff that carried the TB-303 sound onto pop radio worldwide.\n- **Josh Wink -- \"Higher State of Consciousness\" (1995)** & **Aphex Twin -- \"Windowlicker\" (1999)**: Legendary demonstrations of extreme accent/slide programming.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp set-sequencer-length --steps 64\nsynthcraft-mcp set-step --step 0 --midi-note 36 --accent true --slide false --active true\n```\n\n---"}, {"id": "subpage-5-2-tr-808-909-8-voice-drum-machine", "title": "Subpage 5.2: TR-808/909 8-Voice Drum Machine", "body": "### What It Does (Plain English)\nNo samples required: this is an 8-voice percussion synthesizer that generates every drum hit mathematically in real time, allocation-free on the audio thread. It runs on its own 64-step (4-bar) pattern grid synchronized to the main sequencer, complete with realistic closed/open hi-hat choking, groove swing, Euclidean rhythm auto-fill, and 6 instant club kits.\n\n### Controls & Workflow\n- **8 Independent Synthesized Voices**:\n  1. `BD` -- **Kick Drum**: Sine pitch-envelope sweep with click transient and tunable boom decay (from tight 909 punch to earth-shaking 808 sub).\n  2. `SD` -- **Snare Drum**: Dual tuned body oscillators blended with snappy bandpass-filtered noise.\n  3. `CP` -- **Handclap**: Classic triple-burst micro-delayed noise envelope plus reverberant tail.\n  4. `CH` & `OH` -- **Closed & Open Hi-Hat**: 6-oscillator metallic square-wave cluster through a high-pass filter, with authentic **hi-hat choke** (a closed hat immediately silences an open hat).\n  5. `LT` -- **Low Tom**: Pitch-dropping resonant membrane drum.\n  6. `CB` -- **Cowbell**: Dual detuned square waves (`540 Hz` + `800 Hz`) through a sharp bandpass filter.\n  7. `CY` -- **Crash / Ride Cymbal**: Bright shimmering metallic cluster with long decay.\n- **6 Instant Club Kits**: Load `Classic 808`, `Classic 909`, `Berlin Techno`, `Electro Funk`, `Trap Sub`, or `Industrial FM` in one click.\n- **Euclidean Auto-Fill & Swing**: Use the Euclidean fill button to distribute drum hits mathematically (like 5 hits across 16 steps for instant Latin/Afro/Techno polyrhythms) and dial in **Swing** (`50%` straight to `75%` shuffled groove).\n\n### Provenance, Hardware Lineage & History\n- **Roland TR-808 Rhythm Composer (1980)** & **Roland TR-909 (1983)**: Designed by Ikutaro Kakehashi and Tadao Kikumoto in Osaka. The 808 used pure analog transistor circuits (bridged-T resonators for the booming kick and cowbell, six Schmitt-trigger square oscillators for the metallic hi-hats), while the 909 combined punchy analog kicks/snares with crisp 6-bit metallic cymbals. Together, they formed the rhythmic backbone of hip-hop, electro, house, techno, and pop for four decades.\n- **Euclidean Rhythms (Godfried Toussaint, McGill University, 2005)**: Proved that Euclid's ancient greatest-common-divisor algorithm naturally generates almost every traditional world music timeline (Cuban tresillo, bossa nova, West African bell patterns).\n\n### Famous Tracks & Iconic Usage\n- **Marvin Gaye -- \"Sexual Healing\" (1982)** & **Afrika Bambaataa -- \"Planet Rock\" (1982)**: Put the TR-808 kick, snare, clap, and cowbell at the center of R&B and hip-hop forever.\n- **Phil Collins -- \"In the Air Tonight\" (1981)** & **Whitney Houston -- \"I Wanna Dance with Somebody\" (1987)**: Iconic 808/analog drum machine grooves.\n- **Frankie Knuckles -- \"Your Love\" (1987)** & **Jeff Mills -- \"The Bells\" (1996)**: The punchy TR-909 kick and sizzling 909 hi-hats that defined Chicago house and Detroit/Berlin techno.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp load-drum-preset --preset berlin_techno --enabled true --master-level 0.9 --swing 0.56\n```\n\n---"}, {"id": "subpage-5-3-adsr-envelope-tempo-lfo", "title": "Subpage 5.3: ADSR Envelope & Tempo LFO", "body": "### What It Does (Plain English)\nA raw oscillator plays at full volume forever -- like a car horn. Envelopes and LFOs give sound shape and motion. The **ADSR Envelope** sculpts how a note starts, settles, holds, and fades (`Attack`, `Decay`, `Sustain`, `Release`). The **Tempo-Synced LFO** (Low-Frequency Oscillator) acts like an invisible hand rhythmicly turning a knob back and forth in time with your BPM. This page also houses the **8-Route Modulation Matrix**, **Real-Time Arpeggiator**, and **Scala `.scl` Microtonal Tuning** engine.\n\n### Controls & Workflow\n- **ADSR & Tempo LFO**: Dial in snappy plucks (short attack, short decay, low sustain) or lush slow-swelling pads (long attack, long release). Sync the LFO to musical divisions (`1/4`, `1/8`, `1/16`, dotted, triplet) for dubstep wobbles or rhythmic filter pulses.\n- **8-Route Modulation Matrix**: Connect any of 6 modulation sources (`LFO`, `ADSR Env`, `Velocity`, `Mod Wheel`, `Sample & Hold`, `Ambient Drift`) to any of 9 destinations (`Cutoff`, `Resonance`, `FM Index`, `Pulse Width`, `VCO2 Detune`, `Wavefold`, `Stereo Pan`, `Extreme Morph`, `Reverb Mix`) with positive or negative depth.\n- **Arpeggiator**: Hold a chord and let SynthCraft ripple through its notes (`Up`, `Down`, `Up/Down`, `Random`) across 1 to 4 octaves, with a **Latch** button so you can take your hands off the keys to tweak filters.\n- **Scala `.scl` Microtuning**: Break free from standard 12-note piano tuning with 7 built-in scales (`12-TET`, `5-Limit Just Intonation`, `Pythagorean`, `19-TET`, `24-TET Quarter-Tone`, `31-TET`, `Bohlen-Pierce`) or load any `.scl` file from the massive Scala archive.\n\n### Provenance, Hardware Lineage & History\n- **ADSR Envelope (Robert Moog & Vladimir Ussachevsky, 1965)**: Columbia-Princeton Electronic Music Center composer Vladimir Ussachevsky proposed the 4-stage Attack-Decay-Sustain-Release shape to Bob Moog, creating the universal contour model used in virtually every synthesizer since.\n- **Modulation Matrix (Oberheim Matrix-12, 1985)**: Replaced physical patch cables with a flexible digital routing grid capable of subtle velocity expression or wild cross-modulation.\n- **Arpeggiator (Roland Jupiter-4 / Juno-6, 1978-1982)**: Turned simple triad chords into hypnotic, pulsing synth-pop and trance backdrops.\n- **Scala `.scl` Format (Manuel Op de Coul, 1992)**: The global open standard for microtonal and historical tuning systems, embraced by modern microtonal artists like Aphex Twin, Wendy Carlos, and Sevish.\n\n### Famous Tracks & Iconic Usage\n- **Duran Duran -- \"Save a Prayer\" & \"Rio\" (1982)**: Classic Roland Jupiter-4 / Juno-6 latched arpeggiators.\n- **Wendy Carlos -- \"Beauty in the Beast\" (1986)** & **Aphex Twin -- \"Flim\" / \"Syro\" (2014)**: Famous explorations of custom microtonal tunings and expressive modulation routing.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp update-envelope-lfo --attack-ms 12 --decay-ms 280 --sustain 0.4 --release-ms 450 --lfo-rate-hz 4.0 --lfo-depth 0.35\nsynthcraft-mcp set-mod-route --slot 0 --source Velocity --dest Cutoff --amount 0.65\nsynthcraft-mcp set-arpeggiator --mode UpDown --octaves 2 --latch true\nsynthcraft-mcp set-tuning --scale 19-TET\n```"}]}, {"file": "06_scope_spectrum.md", "id": "06_scope_spectrum", "title": "Workbench 6: Oscilloscope & Spectrum", "intro": "Synthesizer sound design becomes twice as fast when you can *see* what you are hearing. This workbench gives you classic laboratory-grade audio metering -- a real-time waveform oscilloscope and a 32-band frequency spectrum analyzer -- so you can check bass weight, spot harsh resonant peaks, and watch wavefolding or pulse-width modulation bend the audio waveform live.", "subpages": [{"id": "subpage-6-1-waveform-oscilloscope", "title": "Subpage 6.1: Waveform Oscilloscope", "body": "### What It Does (Plain English)\nAn oscilloscope draws a zoomed-in snapshot of your sound wave over time (left to right = time, up and down = air pressure / speaker movement). Watching the wave lets you immediately understand synthesis concepts that sound abstract in words: a sine wave looks like a smooth rolling hill, a sawtooth looks like shark teeth, pulse-width modulation squeezes the wave horizontally, and wavefolding literally folds the peaks back toward the center line.\n\n### Controls & Workflow\n- **Live Triggered Waveform**: SynthCraft locks onto zero-crossings so repeating waveforms sit steady on screen instead of jittering wildly.\n- **Compare Before & After**: Watch the scope while sweeping the 4-Pole Filter Cutoff (sharp sawtooth edges round off into a smooth sine wave) or adding distortion/wavefolding (smooth curves crease into jagged spikes).\n\n### Provenance, Hardware Lineage & History\n- **Cathode-Ray Oscilloscopes (Tektronix 1950s-1970s)**: Early electronic music studios like the BBC Radiophonic Workshop (where Delia Derbyshire created the *Doctor Who* theme in 1963) and WDR Cologne (Karlheinz Stockhausen) relied on glowing green laboratory oscilloscopes to tune oscillators and verify wave shapes before computer displays existed.\n- **Korg Minilogue (2016)**: Reintroduced a built-in OLED real-time oscilloscope right on the front panel of an affordable analog synth, making waveform visualization an essential part of modern hardware and software synths.\n\n### Famous Tracks & Iconic Usage\n- **Delia Derbyshire / BBC Radiophonic Workshop -- \"Doctor Who Theme\" (1963)**: Sculpted using test-tone oscillators, tape loops, and laboratory oscilloscopes.\n- **Jerobeam Fenderson -- \"Oscilloscope Music\" (2016)**: Turned XY oscilloscope synthesis itself into an audiovisual art form.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp preview --duration-ms 250 --json\n```\n\n---"}, {"id": "subpage-6-2-32-band-dft-spectrum-dbfs", "title": "Subpage 6.2: 32-Band DFT Spectrum & dBFS", "body": "### What It Does (Plain English)\nWhile the oscilloscope shows *time*, the Spectrum Analyzer shows *frequency* -- from deep sub-bass rumble on the left (20 Hz) to airy treble sparkle on the right (20,000 Hz). It breaks your live sound into 32 frequency bands using a Discrete Fourier Transform (DFT), measures your exact **RMS loudness** (average energy), **Peak dBFS** (loudest instant, where `0 dBFS` is digital clipping), **crest factor** (punchiness), and tracks your fundamental musical pitch in Hertz.\n\n### Controls & Workflow\n- **Check Sub-Bass & Headroom**: Make sure your bassline sits cleanly around `40-90 Hz` without muddying the midrange (`250-500 Hz`), and verify your Peak reading stays safely below `0.0 dBFS` before exporting stems.\n- **Spot Resonant Spikes**: When cranking filter resonance or comb filters, watch the exact harmonic bar jump upward so you can tune it musically to your track's key.\n\n### Provenance, Hardware Lineage & History\n- **Joseph Fourier (1822) & Cooley-Tukey FFT (1965)**: Fourier proved that any complex musical sound can be broken down into a recipe of pure sine waves at different frequencies. Real-time hardware spectrum analyzers (like the Klark Teknik DN60 in 1980s mastering rooms) made frequency balance visible to mix engineers.\n\n### Famous Tracks & Iconic Usage\n- **Modern Club Mastering (Berlin Techno, Drum & Bass, EDM)**: Club sound engineers rely on real-time spectrum analyzers and dBFS meters to ensure kicks and sub-basses translate cleanly onto massive festival subwoofers without distortion.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp analyze-spectrum --duration-ms 500 --json\n```"}]}, {"file": "07_clap_soundcraft.md", "id": "07_clap_soundcraft", "title": "Workbench 7: CLAP & SoundCraft Bridge", "intro": "SynthCraft is not trapped inside a standalone window. The exact same Pure-Rust synthesis engine compiles into a native **CLAP `1.2.2` instrument plugin (`SynthCraft.clap`)** that loads directly inside **SoundCraft**, **REAPER**, and **Bitwig Studio** -- complete with an embedded hardware-styled GPU interface, full MPE / per-note modulation, and shared JSON patch state.", "subpages": [{"id": "subpage-7-1-clap-1-2-2-plugin-descriptor", "title": "Subpage 7.1: CLAP 1.2.2 Plugin Descriptor", "body": "### What It Does (Plain English)\nThis page shows the live plugin identity, capabilities, and installation status of `SynthCraft.clap` (plugin ID `dev.sandraschi.synthcraft`). It also exports the complete CLAP descriptor JSON so DAWs, test harnesses, and automation scripts can verify every supported extension (Audio Ports, Note Ports, Parameters, State, Embedded Win32 GUI, Polyphonic Modulation, and Note Expressions).\n\n### Controls & Workflow\n- **Build & Install**: Run `cargo build --release -p synthcraft-clap && just clap-install` to install `SynthCraft.clap` into `%LOCALAPPDATA%\\Programs\\Common\\CLAP\\SynthCraft.clap`.\n- **Use in SoundCraft & REAPER**: Rescan your CLAP folder in SoundCraft or REAPER (`Options -> Preferences -> Plug-ins -> CLAP`). Insert `SynthCraft` (`dev.sandraschi.synthcraft`) onto any instrument track -- you get sub-5ms audio playback, full DAW automation, and the embedded `CLAP_EXT_GUI` hardware faceplate.\n- **Live Verification**: `SynthCraft.clap` passes `clap-validator` (34 passed, 0 failed) and has been live-tested and bounced directly inside SoundCraft (`-18.44 LUFS`) and opened inside REAPER.\n\n### Provenance, Hardware Lineage & History\n- **CLAP -- Clever Audio Plug-in Standard (u-he & Bitwig, 2022)**: Created by Urs Heckmann (u-he, makers of Diva and Zebra) and Alexandre Bique (Bitwig) under the open MIT license as a modern, thread-safe, license-free successor to proprietary Steinberg VST3. Its killer feature is **non-destructive polyphonic modulation**: a DAW can modulate filter cutoff or pitch on *one single held note* in a chord without moving the main knob or affecting the other notes.\n\n### Famous Tracks & Iconic Usage\n- **Modern Film Scoring & Electronic Production (Bitwig Studio, REAPER, u-he Diva/Hive)**: CLAP's per-note modulation powers expressive electronic scores and generative ambient works where individual notes inside a chord drift independently in timbre and stereo space.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp export-clap --json\n```\n\n---"}, {"id": "subpage-7-2-soundcraft-parameter-map", "title": "Subpage 7.2: SoundCraft Parameter Map", "body": "### What It Does (Plain English)\nEvery knob you turn inside SynthCraft corresponds to a stable, numbered **Parameter ID** (`0x1001` through `0x1019`) that DAWs like SoundCraft and REAPER use to draw automation lanes and apply per-note modulation. This page lists the full parameter table, showing each parameter's hex ID, display name, range, and whether it supports polyphonic per-note modulation (`CLAP_PARAM_IS_MODULATABLE_PER_NOTE_ID`).\n\n### Controls & Workflow\n- **Inspect Stable Parameter IDs**: Check exact IDs before writing DAW automation scripts or hardware MIDI mappings.\n- **Polyphonic Modulation Flags**: Parameters `0x1001..0x1006` and `0x100A` (oscillator mix, detune, FM, filter cutoff, resonance, LFO depth) support live per-note `CLAP_EVENT_PARAM_MOD` offsets directly from SoundCraft or Bitwig modulators.\n- **Zero-Copy Patch Sharing**: Because SoundCraft and SynthCraft share the exact same `SynthPatch` JSON format, any patch you sculpt in standalone SynthCraft loads identically inside your DAW session.\n\n### Provenance, Hardware Lineage & History\n- **DAW Automation & Parameter Hashing**: Classic plugin formats often broke saved songs whenever a developer reordered a knob list. By pinning explicit hexadecimal parameter IDs (`0x1001..0x1019`) in `synthcraft-core::params`, your saved REAPER and SoundCraft projects remain permanently recallable even as SynthCraft adds new workbenches and engines.\n\n### Famous Tracks & Iconic Usage\n- **Precision Filter Automation in Modern Electronic Music (Deadmau5 -- \"Strobe\", 2009; Eric Prydz -- \"Opus\", 2015)**: Iconic 5-minute slow filter-cutoff and resonance climbs rely on sample-accurate DAW parameter automation curves.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp set-patch-param --param cutoff_hz --value 1850\nsynthcraft-mcp export-clap --json\n```"}]}, {"file": "08_djcraft_forge.md", "id": "08_djcraft_forge", "title": "Workbench 8: DJCraft Stem & WAV Forge", "intro": "Designed for live DJs and electronic performers, this workbench bridges studio sound design directly to the club booth. Lock your synthesizer patches to exact deck tempos and harmonic Camelot keys, receive live transport and pad triggers from **DJCraft**, and render beatgrid-accurate `.wav` loops, risers, and sub-drops that drop straight onto a DJ deck with zero drift.", "subpages": [{"id": "subpage-8-1-bpm-camelot-loop-forge", "title": "Subpage 8.1: BPM & Camelot Loop Forge", "body": "### What It Does (Plain English)\nWhen a DJ mixes a live synth loop or transition riser over a playing track, two things must match perfectly: **tempo (BPM)** and **musical key**. This page locks SynthCraft to your DJ set's exact tempo and **Camelot Wheel key** (like `8A` for A Minor or `4A` for F Minor), and connects directly to **DJCraft** over three real-time bridges:\n- **DJLink**: Synchronizes SynthCraft's sequencer and drum machine to DJCraft's live master deck BPM and beat phase.\n- **DJPD**: Receives live performance-pad triggers from DJCraft directly into SynthCraft's voices and drum kit.\n- **DJFX**: Routes live stereo audio (like vocals or a playing deck) from DJCraft into SynthCraft's 16-Band Vocoder, Granular Cloud, or Studio FX Rack.\n\n### Controls & Workflow\n- **Set Camelot Key & Tempo**: Pick your target Camelot key (`1A` through `12B`) and BPM (`60` to `200`).\n- **Bar-Grid Cue Points**: Automatically embeds DJ-ready cue markers (`LOOP_IN`, `FILTER_PEAK`, `DROP_OUT`) into the exported stem manifest so DJCraft knows the exact downbeat and climax of your riser or loop.\n\n### Provenance, Hardware Lineage & History\n- **The Camelot Wheel (Mark Davis, Mixed In Key, 1990s)**: Translates the classical Circle of Fifths into a simple clock-face numbering system (`1A-12A` minor, `1B-12B` major). Any adjacent number (`8A -> 9A` or `8A -> 8B`) mixes harmonically without clashing notes -- a revolution for club DJs and live hybrid electronic acts.\n- **Ableton Link & Pioneer Pro DJ Link (2010s)**: Brought sub-millisecond tempo and phase synchronization between DJ decks, drum machines, and modular synthesizers on stage.\n\n### Famous Tracks & Iconic Usage\n- **Richie Hawtin (Plastikman) & Carl Cox Live Hybrid Sets**: Pioneered locking live TR-909 / TB-303 and modular synth rigs directly to CDJ/software DJ decks so live improvised acid lines and risers lock seamlessly onto playing club records.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp set-camelot-key --key 8A\nsynthcraft-mcp export-djcraft-stem --bars 4 --json\n```\n\n---"}, {"id": "subpage-8-2-riff-wav-stem-exporter", "title": "Subpage 8.2: RIFF WAV & Stem Exporter", "body": "### What It Does (Plain English)\nTurns whatever you have sculpted in SynthCraft -- a 4-bar acid bassline, a 64-step 808/909 drum beat, an 8-bar noise riser, or a single sustained pad chord -- into a crystal-clear, uncompressed **16-bit or 24-bit 48 kHz RIFF PCM `.wav` file** on disk. Because SynthCraft renders offline using the exact same `SynthRt` DSP engine as live playback, what you hear is 100% what gets written to disk.\n\n### Controls & Workflow\n- **Choose Length & Target**: Set exact duration in milliseconds or musical bars, choose an output path (sandbox-verified in MCP mode), and click **Forge & Export `.wav`**.\n- **1-Click Forge & Load**: Render a stem and immediately pass its path and beatgrid manifest to DJCraft for live deck playback.\n\n### Provenance, Hardware Lineage & History\n- **RIFF WAVE Audio Format (Microsoft & IBM, 1991)**: The universal uncompressed studio audio container. Zero lossy compression artifacts, sample-accurate loop boundaries, and instant compatibility with every DAW, sampler, and DJ player on Earth.\n\n### Famous Tracks & Iconic Usage\n- **Modern Stem DJing & Live Sampling (Daft Punk *Alive 2007*, Justice, Fred again..)**: Built around pre-forged, tempo-locked vocal, synth, and percussion stems triggered and mangled live on stage.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp render-wav --path loop_128bpm_8A.wav --duration-ms 2000\n```"}]}, {"file": "09_assistant_help.md", "id": "09_assistant_help", "title": "Workbench 9: Assistant & Help", "intro": "SynthCraft is designed to be explored both by hand and alongside an AI sound-design collaborator. This workbench pairs a local-first Patch Co-Designer chat panel with the full, searchable **37-Subpage Interactive Encyclopedia** you are reading right now.", "subpages": [{"id": "subpage-9-1-chat", "title": "Subpage 9.1: Chat", "body": "### What It Does (Plain English)\nA local-first studio assistant panel for brainstorming sound design recipes, checking which MCP tools control a specific engine, and coordinating patch edits with external AI coding/music agents connected to SynthCraft's `60`-tool MCP `2026-07-28` server.\n\n### Controls & Workflow\n- **Ask About Patches or Routing**: Type natural-language sound design questions (\"How do I dial in a warm 1980s Juno chord pad with subtle chorus?\" or \"Which MCP tool loads the Berlin Techno 808/909 kit?\").\n- **Agent Automation via MCP**: Connect your IDE or AI agent to `synthcraft-mcp --mcp --automation-read-root <DIR> --automation-write-root <DIR>` to let the agent sculpt patches, run Genopatch audio matching, render `.wav` previews, and inspect spectrum data safely inside your sandboxed folders.\n\n### Provenance, Hardware Lineage & History\n- **Model Context Protocol (MCP, 2024-2026)**: Standardized how AI assistants safely inspect and control local desktop tools using structured JSON-RPC schemas and explicit filesystem sandboxes -- turning SynthCraft into a first-class collaborative instrument for both human hands and AI co-producers.\n\n### Famous Tracks & Iconic Usage\n- **Holly Herndon -- \"PROTO\" (2019) & Brian Eno -- \"Generative Music 1\" (1996)**: Landmark milestones in human-plus-machine musical collaboration, where algorithms act as creative studio partners rather than replacements for the artist.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp --mcp --automation-read-root D:\\AudioIn --automation-write-root D:\\AudioOut\n```\n\n---"}, {"id": "subpage-9-2-help-f1", "title": "Subpage 9.2: Help (F1)", "body": "### What It Does (Plain English)\nPress **`F1`** from anywhere in SynthCraft -- or click the **`? Subpage Guide`** button in the top studio bar -- to open human-readable documentation tailored directly to the exact workbench and subpage you are using. No hunting through external PDFs or decoding walls of acronyms: every engine explains what it does in plain language, how to use its controls, which vintage hardware or modern synth inspired it, and which famous records made that sound legendary.\n\n### Controls & Workflow\n- **Contextual `? Guide` Button**: On any of the 37 subpages, click `? Guide` (or press `F1`) to jump straight to that subpage's dedicated handbook.\n- **Live Search**: Filter across all 14 workbenches and 37 subpages by keyword (try searching `303`, `Daft Punk`, `Buchla`, `vocoder`, `OTT`, or `MPE`).\n- **Quick Reference Tabs**: Switch between the **37-Subpage Encyclopedia**, **Get Started**, **60-Tool CLI & MCP Reference**, and **Technical Architecture**.\n- **Keyboard Shortcuts**: `F1` (Help), `Ctrl+K` (Command Palette), `Ctrl+,` (Settings), `Ctrl+Z` / `Ctrl+Y` (64-deep Undo/Redo), `Ctrl+MouseWheel` (UI Zoom).\n\n### Provenance, Hardware Lineage & History\n- **Printed Hardware Owner's Manuals (Roland, Moog, ARP 1970s-1980s)**: Classic Roland and ARP manuals were famous for teaching synthesis from first principles with clear diagrams and musical patch sheets rather than dry engineering specs. SynthCraft brings that same welcoming spirit directly inside the app and as a browsable interactive HTML website (`docs/site/index.html`).\n\n### Famous Tracks & Iconic Usage\n- **Every Bedroom Producer Who Learned From a Synth Manual**: From Aphex Twin modifying his own circuits to Daft Punk reading Roland manuals cover-to-cover, clear documentation turns intimidating hardware into lifelong instruments.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp status --json\nsynthcraft-mcp summary --json\n```"}]}, {"file": "10_studio_settings.md", "id": "10_studio_settings", "title": "Workbench 10: Studio Settings & Prefs", "intro": "Press `Ctrl+,` from anywhere in SynthCraft to configure your studio environment across 6 clean, organized preference tabs -- from low-latency audio drivers and MPE keyboards to hardware faceplates, vintage DAC emulation, DAW plugin paths, and SQLite database hygiene.", "subpages": [{"id": "subpage-10-1-audio-driver-dsp-oversampling", "title": "Subpage 10.1: Audio Driver & DSP Oversampling", "body": "### What It Does (Plain English)\nControls how SynthCraft sends sound to your speakers or studio audio interface (`cpal` / Windows WASAPI), including sample rate (`44.1 kHz` or `48 kHz`), buffer size (lower buffers mean faster keyboard response; larger buffers mean rock-solid stability under heavy CPU load), and internal DSP oversampling for ultra-clean filter saturation and wavefolding without harsh digital aliasing.\n\n### Controls & Workflow\n- **Audio Output Device**: Choose your studio interface, headphones, or speakers.\n- **Sample Rate & Buffer**: `48,000 Hz` is recommended for modern DAW, SoundCraft, and DJCraft workflows.\n- **Oversampling**: Increase oversampling when pushing analog filter drive, Wave Digital Filter circuits, or extreme FM modulation.\n\n### Provenance, Hardware Lineage & History\n- **Oversampling & Anti-Aliasing in Virtual Analog (Clavia Nord Lead 1995, Access Virus 1997, u-he Diva 2011)**: Early digital synths suffered from metallic \"aliasing\" artifacts when oscillators or distortion folded frequencies above half the sample rate. Modern CPUs let SynthCraft run internal analog circuit models at up to **8x oversampling** (`384 kHz` internal rate) for velvet-smooth analog highs.\n\n### Famous Tracks & Iconic Usage\n- **Daft Punk -- \"Discovery\" (2001)** & **The Prodigy -- \"The Fat of the Land\" (1997)**: Celebrated the punch of early virtual-analog engines pushed hard into saturation.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp status --json\n```\n\n---"}, {"id": "subpage-10-2-midi-hardware-clock-mpe", "title": "Subpage 10.2: MIDI Hardware, Clock & MPE", "body": "### What It Does (Plain English)\nConfigures how SynthCraft listens to external hardware keyboards, drum pads, master clocks, and expressive MPE controllers (like the Expressive E Osmose, ROLI Seaboard, or LinnStrument).\n\n### Controls & Workflow\n- **MIDI Input Port & Channel**: Select a specific USB/DIN MIDI port or leave on Omni.\n- **MIDI Clock Sync**: Choose Internal clock, External MIDI Clock, or `DJLink` sync from DJCraft.\n- **MPE Zone Configuration**: Enable MIDI Polyphonic Expression so per-finger pitch bends, vertical slide (`CC 74`), and channel pressure map independently to every held voice.\n\n### Provenance, Hardware Lineage & History\n- **MPE -- MIDI Polyphonic Expression (Roger Linn, ROLI, Apple, 2018)**: Extended 1983's MIDI 1.0 by giving each held finger its own MIDI channel, unlocking violin-like vibrato, polyphonic pitch bends, and independent per-note timbre swells on modern keyboards.\n\n### Famous Tracks & Iconic Usage\n- **Vangelis -- \"Blade Runner Blues\" (1982)** (Yamaha CS-80 polyphonic aftertouch -- the spiritual grandfather of MPE) & **Jordan Rudess / A.R. Rahman** (modern MPE Seaboard & Osmose performances).\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp set-patch-param --param bpm --value 128\n```\n\n---"}, {"id": "subpage-10-3-skins-layouts-knob-physics", "title": "Subpage 10.3: Skins, Layouts & Knob Physics", "body": "### What It Does (Plain English)\nTailors how SynthCraft looks and feels under your mouse and eyes. Switch between **5 hardware skins** (including high-contrast **Daylight Studio** light mode and **Obsidian VCV** dark mode), **4 studio layouts**, and realistic rotary knob drag physics.\n\n### Controls & Workflow\n- **5 Hardware Skins**: Choose between dark Eurorack obsidian, warm vintage analog panels, and crisp WCAG AAA Daylight Studio light mode.\n- **Knob Drag Sensitivity & `Ctrl+MouseWheel` Zoom**: Fine-tune vertical drag speed and zoom the entire interface smoothly to fit laptops or 4K studio monitors.\n- **Language Toggle (`EN` / `DE`)**: Switch all workbench and subpage labels cleanly between English and German.\n\n### Provenance, Hardware Lineage & History\n- **Hardware Industrial Design (Dieter Rams / Braun, Teenage Engineering, Moog)**: Thoughtful panel contrast, clear knob rings, and uncluttered grouping reduce ear and eye fatigue during long late-night studio sessions.\n\n### Famous Tracks & Iconic Usage\n- **Studio Ergonomics Across Every Era**: From the walnut wood cheeks of the Minimoog to the clean anodized aluminum of Eurorack skiffs, tactile visual clarity directly inspires bolder musical choices.\n\n### CLI & MCP Automation\n*(UI preference persisted locally in studio settings.)*\n\n---"}, {"id": "subpage-10-4-pcm-workstation-dac-extreme-dsp-tuning", "title": "Subpage 10.4: PCM Workstation DAC & Extreme DSP Tuning", "body": "### What It Does (Plain English)\nFine-tunes the vintage digital character of Workbench 2's 1990 PCM Workstation (toggle 1988 32 kHz / 12-bit DAC warmth, sample interpolation quality, and bank directory) as well as CPU/quality parameters for the 6 Extreme DSP algorithms.\n\n### Controls & Workflow\n- **DAC Emulation**: Switch between pristine 48 kHz floating-point playback and gritty 1988 32 kHz / 12-bit converter character.\n- **Sample Bank Folder**: Points to `Documents/SynthCraft/Banks` for your `.sfz`, `.sf2`, and `.wav` packs.\n\n### Provenance, Hardware Lineage & History\n- **12-Bit / 32 kHz Samplers (E-mu SP-1200 1987, Akai MPC60 1988, Korg M1 1988)**: Golden-era hip-hop and house producers noticed that pitched-down 12-bit samples had a crunchy, mid-forward punch that sounded better in a club than sterile hi-fi recordings.\n\n### Famous Tracks & Iconic Usage\n- **Pete Rock & CL Smooth -- \"They Reminisce Over You (T.R.O.Y.)\" (1992)** & **Wu-Tang Clan -- \"C.R.E.A.M.\" (1993)**: Immortalized the warm crunch of 12-bit vintage sampler converters.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp list-banks\n```\n\n---"}, {"id": "subpage-10-5-clap-soundcraft-djcraft-paths", "title": "Subpage 10.5: CLAP, SoundCraft & DJCraft Paths", "body": "### What It Does (Plain English)\nManages the filesystem paths that connect SynthCraft to the rest of your studio: your system CLAP plugin folder (`%LOCALAPPDATA%\\Programs\\Common\\CLAP`), external CLAP plugin scan paths for the 3U CLAP Host module, SoundCraft session folders, and DJCraft stem export targets.\n\n### Controls & Workflow\n- **Scan External CLAP Plugins**: Discover third-party `.clap` synths and effects installed on your PC so you can load them straight into Workbench 1's 3U `CLAP HOST` module.\n- **Verify `SynthCraft.clap` & VCV Rack 2**: Check install locations for both `SynthCraft.clap` and the native VCV Rack 2 `plugin.dll`.\n\n### Provenance, Hardware Lineage & History\n- **Open Studio Interoperability**: Keeps all plugin and stem paths transparent, user-controlled, and free from proprietary cloud lock-in.\n\n### Famous Tracks & Iconic Usage\n- **Modern Hybrid DAW + Modular Workflows**: Lets producers bounce seamlessly between standalone sketching, VCV Rack modular patching, SoundCraft/REAPER mixing, and DJCraft live performance.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp scan-clap-plugins --json\nsynthcraft-mcp get-clap-host-status --json\n```\n\n---"}, {"id": "subpage-10-6-ai-assistant-mcp-sqlite-db", "title": "Subpage 10.6: AI Assistant, MCP & SQLite DB", "body": "### What It Does (Plain English)\nDisplays the active SQLite database path (`%LOCALAPPDATA%\\synthcraft\\synthcraft.db`), schema version, automatic pre-migration backup status, and the security sandbox rules (`--automation-read-root` and `--automation-write-root`) that keep AI MCP tools safely confined to approved folders.\n\n### Controls & Workflow\n- **Inspect Database Health**: All patch edits save off the UI thread so audio never glitches. Corrupt rows are quarantined automatically rather than crashing startup.\n- **MCP Sandbox Verification**: Verify which read/write folders are exposed to external AI agents.\n\n### Provenance, Hardware Lineage & History\n- **SQLite (D. Richard Hipp, 2000)**: The world's most reliable embedded single-file database -- ensuring your patch library is fast, portable, ACID-safe, and readable forever without cloud servers.\n\n### Famous Tracks & Iconic Usage\n- **Every Working Studio's Most Important Feature**: Never losing a 3 AM patch breakthrough to a crash or format change.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp status --json\nsynthcraft-mcp export-wasm-bundle --out-dir D:\\AudioOut\\wasm_bundle\n```"}]}, {"file": "11_nextgen_lab.md", "id": "11_nextgen_lab", "title": "Workbench 11: Next-Gen Lab (MSEG / Granular / Spectral / Genopatch)", "intro": "This is where modern desktop computing power (multi-core CPUs, gigabytes of RAM, and GPU-accelerated visuals) lets SynthCraft leap far beyond what dedicated hardware synth boxes can do. Sculpt custom drawable modulation curves, morph between formant vowels, freeze live audio into 24-grain clouds, paint individual overtones in a 64-partial additive engine, or let a multi-core evolutionary algorithm reverse-engineer any audio sample into a playable SynthCraft patch.", "subpages": [{"id": "subpage-11-1-mseg-dual-morph-filter-b", "title": "Subpage 11.1: MSEG & Dual Morph Filter B", "body": "### What It Does (Plain English)\nStandard ADSR envelopes only have four straight segments. A **Multi-Segment Envelope Generator (MSEG)** lets you draw up to **16 custom breakpoints** with adjustable tension curves -- turning modulation into bouncing balls, stuttering rhythmic gates, complex risers, or evolving ambient swells. Alongside it sits **Dual Morphing Filter B**, a second independent filter you can wire in **Series** (Filter A feeds into Filter B) or **Parallel** (both filters blend side-by-side), featuring **Vocal Formant (A-E-I-O-U)**, **Comb +/-** (metallic flanging/resonator), and an aggressive **Korg MS-20 Screamer** mode. Every modulated knob displays a live glowing **Modulation Ring** showing exactly how far the MSEG is moving it in real time.\n\n### Controls & Workflow\n- **Draw Your Curve**: Click and drag breakpoints on the 16-point spline canvas, choose `OneShot`, `Loop`, or `TempoSync` mode, and dial in **Rate** and **Depth**.\n- **Shape Dual Filter B**: Pick `FormantVowel` (morph smoothly from *Ah* to *Ee* to *Ooh* for talking basses and choirs), `CombPos` / `CombNeg` (for robotic, string-like metallic resonances), or `Ms20Screamer` (for snarling, self-oscillating distortion). Blend between `Series` and `Parallel` routing.\n\n### Provenance, Hardware Lineage & History\n- **Drawable MSEGs (Xfer Serum 2014, Matt Tytel's Vital 2020, Kilohearts Phase Plant 2019)**: Steve Duda's *Serum* revolutionized modern electronic production by making modulation visual -- letting producers draw custom LFO/MSEG shapes and see animated rings dancing around every modulated knob.\n- **Korg MS-20 Korg-35 Filter (1978)**: Famous for its raw, screaming dual high-pass/low-pass resonant filter that snarls aggressively instead of staying polite like a Moog ladder.\n- **Formant & Comb Filters (E-mu Morpheus Z-Plane 1993, Waldorf Q 1999)**: Unlocked talking \"growl\" basses and metallic resonant sweeps impossible on simple low-pass filters.\n\n### Famous Tracks & Iconic Usage\n- **Daft Punk -- \"Da Funk\" (1995)** & **The Chemical Brothers -- \"Block Rockin' Beats\" (1997)**: Legendary screaming Korg MS-20 filter leads and basslines.\n- **Skrillex -- \"Scary Monsters and Nice Sprites\" (2010)** & **Noisia -- \"Stigma\" (2009)**: Defined modern bass music with talking vocal formant filters and comb-filter metallic growls.\n- **Flume & Disclosure (2013-2020)**: Signature choppy, bouncing MSEG-drawn synth chord stabs.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp set-mseg-filter2 --mseg-enabled true --mseg-mode Loop --mseg-rate-hz 2.0 --mseg-depth 0.7 --filter2-enabled true --filter2-mode FormantVowel --filter2-cutoff-hz 1100 --filter2-resonance 0.65 --filter2-morph 0.4 --filter2-mix 0.75\n```\n\n---"}, {"id": "subpage-11-2-granular-cloud-64-partial-spectral", "title": "Subpage 11.2: Granular Cloud & 64-Partial Spectral", "body": "### What It Does (Plain English)\nTwo radically different ways to turn sound into liquid sculpture:\n- **24-Grain Live-Capture Granular Cloud**: Continuously records your live synthesizer output (or `DJFX` audio) into a circular buffer, then sprays up to **24 tiny overlapping audio droplets (\"grains\")** back out -- letting you freeze a moment in time, scatter grains across the stereo field, pitch-shift them up an octave for angelic shimmer, or turn a short pluck into an infinite cinematic pad.\n- **64-Partial Spectral Additive Sculptor**: Builds sound directly from **64 individual harmonic sine waves (partials)**, just like a 64-drawbar super-organ. Tilt the spectrum brighter or darker, shift the odd/even harmonic balance (hollow clarinet vs. rich brass), or stretch the partials out of tune (`Inharmonicity`) to morph a warm organ into shimmering church bells or alien glass chimes.\n\n### Controls & Workflow\n- **Granular Cloud**: Toggle **Enable**, hit **Freeze** to lock the live audio buffer in place, and sweep **Grain Density**, **Grain Size (ms)**, **Position**, **Spray (randomness)**, and **Pitch Shift (semitones)**.\n- **64-Partial Spectral**: Enable the spectral bank, sculpt **Tilt**, **Odd/Even Balance**, **Comb/Stretch Inharmonicity**, and watch the 64 partial bars react live.\n\n### Provenance, Hardware Lineage & History\n- **Granular Synthesis (Iannis Xenakis 1960s, Curtis Roads 1974, Arturia Pigments & Mutable Instruments Clouds 2015)**: Mathematician-composer Iannis Xenakis envisioned sound as clouds of microscopic acoustic particles. Modern desktop CPUs allow SynthCraft to run 24 smooth Hann-windowed stereo grains live with zero clicks.\n- **Additive Synthesis (Telharmonium 1897, Hammond Organ 1935, Kawai K5000 1996, Image-Line Harmor 2011)**: Literally builds any timbre from Fourier's recipe of individual harmonic partials.\n\n### Famous Tracks & Iconic Usage\n- **Jon Hopkins -- \"Open Eye Signal\" & \"Emerald Rush\" (2013-2018)**: Lush, frozen granular clouds and evolving crystalline textures.\n- **Radiohead -- \"Everything In Its Right Place\" (2000)** & **Brian Eno -- \"Apollo\" (1983)**: Iconic ambient/granular textural manipulation.\n- **Hammond B3 / Kawai K5000 Classics (Deep Purple, Aphex Twin)**: Pure harmonic partial sculpting from warm drawbars to glassy additive bells.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp set-granular-spectral --granular-enabled true --granular-freeze false --granular-density 18 --granular-size-ms 95 --granular-mix 0.55 --spectral-enabled true --spectral-tilt -0.2 --spectral-odd-even 0.6 --spectral-mix 0.45\n```\n\n---"}, {"id": "subpage-11-3-genopatch-ai-audio-to-patch", "title": "Subpage 11.3: Genopatch AI Audio-to-Patch", "body": "### What It Does (Plain English)\nEver heard a cool bass, bell, or lead sound and wished your synthesizer could automatically figure out the knob settings to recreate it? **Genopatch** is a multi-core evolutionary synthesizer matcher (powered by Rust's `std::thread::scope` across all your CPU cores). Feed it a target audio profile -- or click one of the built-in target archetypes -- and watch a population of candidate synth patches evolve across generations, mutating and cross-breeding until their 32-band spectral fingerprint matches the target sound.\n\n### Controls & Workflow\n- **Pick a Target & Run Evolution**: Choose a target archetype (or target spectrum), set the number of **Generations** and **Population Size**, and click **Evolve Patch**.\n- **Apply Best Candidate**: Watch the spectral fitness score climb in real time across your CPU cores, inspect the top evolved parameters, and click **Apply to Synth** to play the newly discovered patch immediately.\n\n### Provenance, Hardware Lineage & History\n- **Sonic Charge Synplant 2 \"Genopatch\" (Magnus Lidstrom, 2023)**: Stunned the synthesizer world by letting musicians drop any short audio recording onto a seed and letting an AI/evolutionary optimizer grow a playable synth patch that mimics it -- plus a whole garden of musical \"mutations\" around it. SynthCraft brings a pure-Rust, multi-core, offline-capable evolutionary matcher directly into your studio with zero cloud APIs required.\n\n### Famous Tracks & Iconic Usage\n- **Modern Film & Game Sound Design (2023-2026)**: Producers use evolutionary patch matching to turn field recordings (a slammed car door, a violin bow, a subway screech) into fully playable polyphonic synthesizer instruments.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp run-genopatch --target-preset acid_squelch --generations 12 --population 24 --apply true --json\n```"}]}, {"file": "12_pro_lab.md", "id": "12_pro_lab", "title": "Workbench 12: Pro Lab (6-Op FM / Unison / Reorderable FX / 2D Physics & 8x WDF)", "intro": "This workbench unleashes serious studio horsepower: a full 6-operator Thru-Zero FM matrix, a massive 16-voice Hyper-Unison stack, a reorderable pro studio effects rack, a real-time 2D Finite-Difference Time-Domain vibrating plate simulator, and 8x oversampled Wave Digital Filter models of legendary analog circuits.", "subpages": [{"id": "subpage-12-1-6-op-fm-matrix-16-voice-unison", "title": "Subpage 12.1: 6-Op FM Matrix & 16-Voice Unison", "body": "### What It Does (Plain English)\n- **6-Operator Thru-Zero FM Matrix**: Instead of fixed vintage algorithms, you get a complete **6x6 modulation grid** where any of the 6 sine operators can frequency-modulate any other operator (or itself for gritty feedback). Because it uses **Thru-Zero FM** (allowing oscillator phase to smoothly reverse through zero), even extreme modulation stays rock-solid in musical pitch -- ideal for crystalline electric pianos, metallic bells, woody marimbas, and ripping modern basslines.\n- **16-Voice Hyper-Unison**: Stacks up to **16 detuned copies** of your sound spread wide across the stereo panorama with customizable detune curves and stereo width -- turning a single humble sawtooth into a towering festival trance lead or cavernous cinematic pad.\n\n### Controls & Workflow\n- **FM Matrix**: Enable the 6-Op engine, set operator harmonic **Ratios** (`0.5`, `1.0`, `2.0`, `3.5`, `7.0`...), tweak individual modulation depths in the 6x6 matrix, or load a preset algorithm (Electric Piano, Tubular Bell, Slap FM Bass, Metallic Perc).\n- **Hyper-Unison**: Dial **Voices** (`1` to `16`), **Detune (cents)**, and **Stereo Spread (`0%` mono to `100%` ultra-wide)**.\n\n### Provenance, Hardware Lineage & History\n- **FM Synthesis (John Chowning, Stanford 1967 -> Yamaha DX7, 1983)**: John Chowning discovered that modulating one sine wave's frequency at audio rate with another creates extraordinarily rich, bell-like and brassy harmonics. Yamaha licensed his patent and released the **DX7** in 1983, which instantly reshaped 1980s pop, R&B, and film music. Later, **Native Instruments FM8 (2006)** replaced fixed DX7 algorithms with a freeform 6x6 routing matrix, and modular designers introduced **Thru-Zero FM** so deep modulation never drifted flat or sharp.\n- **SuperSaw & Hyper-Unison (Roland JP-8000, 1996 -> Access Virus TI HyperSaw, 2005)**: Roland's JP-8000 stacked 7 detuned sawtooth waves on a single key, single-handedly defining the euphoric trance anthem sound of the late 1990s and 2000s.\n\n### Famous Tracks & Iconic Usage\n- **A-ha -- \"Take On Me\" (1985)** & **Whitney Houston -- \"Greatest Love of All\" (1985)**: Iconic Yamaha DX7 crystalline electric piano (`E.PIANO 1`) and punchy FM synth bass.\n- **Kenny Loggins -- \"Danger Zone\" (1986)** & **Phil Collins -- \"Sussudio\" (1985)**: Classic DX7 metallic brass and bass punch.\n- **Skrillex -- \"Bangarang\" (2011)**: Modern extreme FM growl basses built on multi-operator modulation matrices.\n- **Darude -- \"Sandstorm\" (1999)** & **Tiesto -- \"Adagio for Strings\" (2004)**: Towering Roland JP-8000 SuperSaw / Hyper-Unison trance leads.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp set-fm6-unison --fm-enabled true --fm-mix 0.7 --unison-voices 12 --unison-detune-cents 28 --unison-spread 0.85\n```\n\n---"}, {"id": "subpage-12-2-reorderable-fx-ott-ir-shimmer-tape", "title": "Subpage 12.2: Reorderable FX (OTT/IR/Shimmer/Tape)", "body": "### What It Does (Plain English)\nRaw synthesizer sounds come alive inside a great studio effects chain -- and the *order* of your effects changes the sound dramatically (putting Reverb *before* OTT compression creates huge roaring shoegaze walls; putting Tape saturation *after* Delay glues echoes together warmly). SynthCraft gives you **4 boutique studio effects** that you can drag or click to reorder freely:\n1. **OTT 3-Band Multiband Compressor**: Splits audio into Low, Mid, and High bands and applies aggressive upward + downward compression (\"Over The Top\"), bringing quiet details forward and giving leads and basses that unmistakable modern crisp loudness.\n2. **Convolution IR Reverb**: Places your synth inside a real acoustic space (cathedral, tiled hall, vintage spring tank, studio plate) by convolving your audio with an Impulse Response.\n3. **Shimmer Reverb**: Feeds a lush reverb tail through an octave-up (`+12 semitones`) pitch shifter for glowing, angelic ambient halos.\n4. **Analog Tape & Bitcrusher**: Adds warm magnetic tape saturation, gentle wow/flutter pitch drift, and optional lo-fi sample-rate/bit-depth crunch.\n\n### Controls & Workflow\n- **Reorder Slots**: Use the up/down arrows on each rack unit to change the exact signal flow order on the fly.\n- **Dial Mix & Depth**: Each unit has an independent enable toggle, wet/dry mix, and character controls.\n\n### Provenance, Hardware Lineage & History\n- **OTT Multiband Compression (Ableton Live Multiband Dynamics preset -> Steve Duda's Xfer OTT)**: Originally a hidden preset inside Ableton Live, EDM and hyperpop producers fell in love with its hyper-bright upward compression, turning \"OTT\" into a verb in modern production.\n- **Shimmer Reverb (Brian Eno & Daniel Lanois, 1984)**: Invented in the studio by patching an Eventide H949/H3000 harmonizer into the feedback loop of an AMS RMX16 / Lexicon 224 reverb.\n- **Analog Tape Saturation (Roland RE-201 Space Echo 1974, Studer A800)**: Magnetic tape naturally softens harsh digital highs and thickens low-mid punch.\n\n### Famous Tracks & Iconic Usage\n- **U2 -- \"The Unforgettable Fire\" (1984) & Brian Eno -- \"Apollo\" (1983)**: The birth of **Shimmer Reverb**.\n- **Boards of Canada -- \"Roygbiv\" (1998)**: Iconic warm, wobbly **Analog Tape** wow/flutter nostalgia.\n- **Porter Robinson, Madeon, Deadmau5 & Skrillex (2010s-2020s)**: Signature bright, larger-than-life **OTT** multiband synth gloss.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp set-studio-fx --ott-enabled true --ott-depth 0.55 --ir-enabled true --ir-mix 0.35 --shimmer-enabled true --shimmer-mix 0.3 --tape-enabled true --tape-drive 0.4\n```\n\n---"}, {"id": "subpage-12-3-2d-fdtd-mesh-8x-wdf-circuits", "title": "Subpage 12.3: 2D FDTD Mesh & 8x WDF Circuits", "body": "### What It Does (Plain English)\nTwo flagship \"Goliath CPU\" physics engines that would melt a tiny hardware synth chip:\n- **8x8 2D FDTD Physical Modeling Mesh**: Simulates an actual vibrating two-dimensional physical membrane, steel plate, or glass pane in real time using the 2D wave equation (Finite-Difference Time-Domain). Strike or excite it at different coordinates to synthesize living snare skins, Tibetan singing bowls, bowed metallic plates, and organic percussion that never sound identical twice.\n- **8x Oversampled Wave Digital Filter (WDF) Circuits**: Rather than approximating analog warmth with a cheap curve, WDF solves the actual electrical Kirchhoff voltage and current equations of real vintage components at **8x internal sample rate**:\n  - **Moog CP3 Mixer Overdrive**: Legendary asymmetric discrete-transistor clipping that thickens basslines with warm even harmonics.\n  - **Buchla 292 Vactrol Low-Pass Gate**: Models the sluggish light-dependent resistor (cadmium-sulfide cell) that gives West-Coast synths their organic, woody decay.\n  - **TB-303 Diode Ladder Filter**: Models the quirky 18 dB/octave diode clipping and bass-thinning resonance of Roland's iconic acid box.\n\n### Controls & Workflow\n- **2D FDTD Mesh**: Enable the mesh, choose a material (`Membrane`, `SteelPlate`, `GlassPane`, `WoodMarimba`), and adjust **Tension**, **Damping**, and **Strike Position**.\n- **8x WDF Circuit**: Enable the circuit stage, choose `MoogCp3`, `Buchla292Lpg`, or `Tb303Diode`, and push **Drive** and **Mix** to hear authentic component-level analog saturation.\n\n### Provenance, Hardware Lineage & History\n- **Wave Digital Filters (Alfred Fettweis, Ruhr University Bochum, 1971 -> Kurt Werner / Stanford CCRMA, 2015)**: Mathematical framework that converts real analog circuit schematics (resistors, capacitors, diodes, transistors) directly into stable, zero-delay digital audio filters.\n- **2D Waveguide & FDTD Acoustic Simulation (Stefan Bilbao, University of Edinburgh, *Numerical Sound Synthesis*, 2009)**: Brought true 2D vibrating-plate physics to real-time musical synthesis.\n\n### Famous Tracks & Iconic Usage\n- **Moog Modular CP3 Overdrive (Wendy Carlos, Keith Emerson, Tangerine Dream 1970s)**: The unmistakable fat, crunchy analog overdrive heard when hot oscillator signals slam into a Moog CP3 mixer.\n- **Buchla 292 Vactrol LPG (Morton Subotnick, Kaitlyn Aurelia Smith)**: Organic, breathing electronic percussion that blurs the line between acoustic instruments and electricity.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp set-physical-wdf --mesh-enabled true --mesh-material SteelPlate --mesh-tension 0.6 --mesh-damping 0.25 --wdf-enabled true --wdf-mode MoogCp3 --wdf-drive 0.65 --wdf-mix 0.8\n```"}]}, {"file": "13_visuals_mpe_ddsp.md", "id": "13_visuals_mpe_ddsp", "title": "Workbench 13: Visuals, MPE & Neural DDSP", "intro": "See your sound in three dimensions, bend and breathe into individual notes inside a chord with modern MPE touch expression, and transform raw synthesizer waveforms into acoustic violin, flute, saxophone, or cello timbres using a real-time Neural DDSP (Differentiable Digital Signal Processing) harmonic-plus-noise decoder.", "subpages": [{"id": "subpage-13-1-3d-waterfall-lissajous-scope", "title": "Subpage 13.1: 3D Waterfall & Lissajous Scope", "body": "### What It Does (Plain English)\nTwo mesmerizing, high-frame-rate studio analyzers built right into the workspace:\n- **24-Slice 3D Perspective Waterfall Spectrogram**: Draws your audio spectrum flowing backward into 3D space over time -- like a glowing mountain range of harmonics. Watch filter sweeps carve valleys, shimmer reverbs light up high mountain peaks, and 808 kicks thunder down the low-frequency canyon.\n- **Lissajous Stereo Vectorscope & Phase Correlation Meter**: Plots Left vs. Right audio channels as a glowing X/Y cloud so you can instantly verify stereo width and club-system mono compatibility. A vertical line means pure mono; a wide balanced sphere means lush stereo; a flat horizontal line warns of phase cancellation (check the **Phase Correlation** bar from `-1.0` out-of-phase to `+1.0` mono-safe).\n\n### Controls & Workflow\n- **Watch Live While Playing**: Play notes or run the 64-step sequencer to see the 24-slice waterfall scroll smoothly in real time.\n- **Check Club Mono Safety**: Keep the Phase Correlation readout above `+0.2` on basslines and leads so your mix never vanishes when played on a mono club PA or phone speaker.\n\n### Provenance, Hardware Lineage & History\n- **RTW / DK-Audio Stereo Phase Scopes (1980s-1990s)** & **iZotope Insight / FabFilter Pro-Q**: Broadcast and mastering studios mounted CRT Lissajous vectorscopes next to mixing consoles so engineers could catch stereo phase problems at a glance.\n- **3D Waterfall Spectrograms (Sonar & Spectral Lab Tools -> modern GPU synths)**: Turned frequency-over-time analysis into an intuitive visual compass for sound designers.\n\n### Famous Tracks & Iconic Usage\n- **Pink Floyd -- \"The Dark Side of the Moon\" (1973)** & **Tipper / Amon Tobin**: Masterclasses in wide, phase-coherent 3D stereo imaging that look like living geometric art on a Lissajous vectorscope.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp analyze-spectrum --duration-ms 500 --json\n```\n\n---"}, {"id": "subpage-13-2-mpe-clap-poly-mod-touch-pad", "title": "Subpage 13.2: MPE & CLAP Poly-Mod Touch Pad", "body": "### What It Does (Plain English)\nTraditional keyboards treat every finger in a chord identically: if you move the pitch wheel or filter knob, *all* notes move together. **MPE (MIDI Polyphonic Expression)** and **CLAP `1.2.2` Poly-Mod** break that limitation. Every single held note gets its own independent **Pitch Bend (X)**, **Timbre Slide (Y)**, and **Pressure (Z)** -- and you can test and perform it right on screen with SynthCraft's interactive **2D MPE Expression Touch Pad**, even if you do not own an MPE hardware controller yet.\n\n### Controls & Workflow\n- **Perform on the 2D Touch Pad**: Click and drag horizontally to bend pitch smoothly on the active voice, and drag vertically to open the filter, sweep wavetable position, or add vibrato.\n- **Hardware MPE & DAW Poly-Mod**: Plug in an Expressive E Osmose, ROLI Seaboard, or LinnStrument, or load `SynthCraft.clap` in SoundCraft / Bitwig Studio to send live `CLAP_EVENT_NOTE_EXPRESSION` and `CLAP_EVENT_PARAM_MOD` automation per individual note.\n\n###
