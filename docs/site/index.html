Provenance, Hardware Lineage & History\n- **Yamaha CS-80 (1977)**: The legendary 220-pound analog monolith with polyphonic aftertouch and a ribbon controller -- the first synth to feel as expressive under the fingers as a cello or trumpet.\n- **Expressive E Osmose (2022) & ROLI Seaboard (2013)**: Brought three-dimensional per-finger expression into modern studios via the MPE standard.\n\n### Famous Tracks & Iconic Usage\n- **Vangelis -- \"Blade Runner (End Titles)\" & \"Blade Runner Blues\" (1982)**: The single most famous demonstration of polyphonic per-note expression in synthesizer history, performed live on the Yamaha CS-80.\n- **Toto -- \"Africa\" (1982)** & **Peter Gabriel -- \"Red Rain\" (1986)**: Lush, breathing polyphonic-aftertouch synth brass and pads.\n\n### CLI & MCP Automation\n*(Live per-note expression runs automatically over MIDI MPE and CLAP `1.2.2` `CLAP_EVENT_NOTE_EXPRESSION` / `CLAP_EVENT_PARAM_MOD`.)*\n\n---"}, {"id": "subpage-13-3-neural-ddsp-timbre-transfer", "title": "Subpage 13.3: Neural DDSP Timbre Transfer", "body": "### What It Does (Plain English)\n**DDSP (Differentiable Digital Signal Processing)** is a breakthrough in musical AI: instead of generating muddy, glitchy raw audio samples with a giant black-box neural network, a lightweight neural decoder predicts clean, interpretable **32-harmonic additive amplitudes + filtered breath/bow noise** directly from your live played pitch and loudness. That means you can play any melody on your synthesizer and smoothly morph its timbre into a **Solo Violin**, **Concert Flute**, **Tenor Saxophone**, **Warm Cello**, **Trumpet**, or **Ethereal Choir** in real time on your CPU with zero latency spikes.\n\n### Controls & Workflow\n- **Pick a Latent Timbre Embedding**: Select from 6 acoustic-neural embeddings (`Violin`, `Flute`, `Saxophone`, `Cello`, `Trumpet`, `Choir`).\n- **Sculpt Harmonic vs. Noise Balance**: Dial **Harmonic Gain** (the singing pitched body), **Noise Gain** (bow rosin, flute breath chiff, or sax reed air), **Brightness**, and **Wet/Dry Mix** to blend acoustic realism with pure electronic synthesis.\n\n### Provenance, Hardware Lineage & History\n- **Google Magenta DDSP (Jesse Engel, Lamtharn Hantrakul, Chenjie Gu & Adam Roberts, ICLR 2020)**: Demonstrated that combining classic DSP oscillators and filtered noise with compact neural control achieves lifelike acoustic timbre transfer using a tiny fraction of the compute of raw waveform neural audio models.\n\n### Famous Tracks & Iconic Usage\n- **Google Magenta Tone Transfer & Modern Experimental Electronic Pop (2020-2026)**: Producers hum a melody into a microphone or play a simple synth line and transform it into hyper-expressive hybrid violin/saxophone/synth hybrids that bend physics in ways no physical instrument can.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp set-ddsp-timbre --enabled true --preset Violin --harmonic-gain 0.85 --noise-gain 0.25 --mix 0.7\n```"}]}, {"file": "14_perf_master.md", "id": "14_perf_master", "title": "Workbench 14: Performance & Mastering Suite", "intro": "The finishing workbench turns SynthCraft into a complete live stage rig and radio-ready mastering desk. Trigger lush jazz and house chords with one finger, talk through a classic 16-band analog vocoder, morph seamlessly across 8 full synthesizer scenes with a crossfader or 4-corner XY pad, and polish your final stereo output through a true-peak studio mastering chain.", "subpages": [{"id": "subpage-14-1-chord-memory-scale-lock", "title": "Subpage 14.1: Chord Memory & Scale Lock", "body": "### What It Does (Plain English)\nYou do not need ten years of conservatory piano training to write rich, emotional chord progressions. **Chord Memory** turns every single key you press into a full polyphonic chord chosen from **10 classic musical voicings** (Major, Minor, Minor 7th, Major 7th, Minor 9th, Sus4, Power 5th, House Stab, Dub Techno Minor 9th, and Neo-Soul 11th). Pair it with **Scale Lock** (Major, Natural Minor, Dorian, Phrygian, Harmonic Minor, Pentatonic, Blues) so every note you play or sequence snaps cleanly into key, plus a built-in **Riff Generator** for instant melodic ideas.\n\n### Controls & Workflow\n- **1-Finger Chords**: Enable **Chord Memory** and select a voicing (try `DubMinor9` with a resonant low-pass filter and ping-pong delay for instant Berlin dub techno, or `HouseStab` with the M1 Piano/Organ for classic 90s house).\n- **Scale Lock**: Choose your root note (`C` through `B`) and scale -- zero wrong notes during live improvisation.\n- **Riff Generator**: Click **Generate Riff** to populate the sequencer with a musical, scale-locked groove in one click.\n\n### Provenance, Hardware Lineage & History\n- **Roland Juno-60 / Polysix / Korg Mono/Poly Chord Memory (1981-1982)**: Early 1980s polyphonic synths included a \"Chord Memory\" button that latched a chord shape and transposed it in parallel up and down the keyboard. That exact parallel minor-7th/minor-9th movement -- technically \"forbidden\" in classical music theory -- accidentally became the harmonic DNA of **Detroit Techno**, **Chicago Deep House**, and **Berlin Dub Techno**.\n\n### Famous Tracks & Iconic Usage\n- **Inner City -- \"Good Life\" (1988)** & **Derrick May -- \"Strings of Life\" (1987)**: Classic Detroit house/techno parallel synth chord stabs.\n- **Basic Channel -- \"Quadrant Dub\" (1994)** & **Larry Heard (Mr. Fingers) -- \"Can You Feel It\" (1986)**: Hypnotic, echoing minor-7th and minor-9th Chord Memory stabs.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp set-perf-master --chord-enabled true --chord-mode DubMinor9 --scale-lock Minor --root-note 0\n```\n\n---"}, {"id": "subpage-14-2-16-band-analog-vocoder", "title": "Subpage 14.2: 16-Band Analog Vocoder", "body": "### What It Does (Plain English)\nA **Vocoder** (\"Voice Encoder\") makes your synthesizer literally *talk* or *sing*. It splits a voice signal (the **Modulator** -- either SynthCraft's built-in robotic speech formant generator or live vocal audio coming in from `DJFX`) into **16 frequency bands**, measures how loud each band is, and applies those exact 16 volume envelopes onto your synthesizer's oscillators (the **Carrier**). Play a thick sawtooth chord and hear your synth speak like a cybernetic choir!\n\n### Controls & Workflow\n- **Carrier + Modulator**: Play any bright, harmonically rich patch (sawtooth, supersaw, or 6-Op FM works best -- pure sine waves lack the upper harmonics needed for intelligible speech!).\n- **Sculpt the Voice**: Toggle **Enable**, adjust **Formant Shift** (shift downward for booming giant robots or upward for bright chipmunk/cyber-pop vocals), **Unvoiced Sibilance** (adds crisp \"s\" and \"t\" consonants), and **Wet/Dry Mix**.\n\n### Provenance, Hardware Lineage & History\n- **Homer Dudley / Bell Labs Voder & Vocoder (1939)**: Originally invented to compress telephone speech across transatlantic cables and later used for encrypted WWII communications (SIGSALY).\n- **Sennheiser VSM-201 (1977), Roland VP-330 Vocoder Plus (1979) & EMS Vocoder 2000 (1977)**: Musicians hijacked the telecom technology to invent the iconic robotic voice of synth-pop, electro, funk, and French house.\n\n### Famous Tracks & Iconic Usage\n- **Kraftwerk -- \"The Robots\" (1978)** & **Herbie Hancock -- \"I Thought It Was You\" (1978)**: Iconic Sennheiser VSM-201 robotic vocals.\n- **Daft Punk -- \"Around the World\" (1997)** & **\"Harder, Better, Faster, Stronger\" (2001)**: Made the vocoder / talkbox one of the most beloved hooks in pop and dance history.\n- **Laurie Anderson -- \"O Superman\" (1981)** & **Imogen Heap -- \"Hide and Seek\" (2005)**: Breathtaking, hauntingly emotional vocal harmony vocoding.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp set-perf-master --vocoder-enabled true --vocoder-mix 0.85 --vocoder-formant-shift 0.15\n```\n\n---"}, {"id": "subpage-14-3-8-scene-morph-xy-pad", "title": "Subpage 14.3: 8-Scene Morph & XY Pad", "body": "### What It Does (Plain English)\nLive electronic music thrives on dramatic transitions -- building from a whisper-quiet filtered verse into a roaring, detuned, reverb-drenched festival drop with a single sweep of one hand. The **8-Scene Morph & XY Pad** lets you snapshot up to **8 complete macro scenes** (`Scene 1..8`) and glide smoothly between them using either a horizontal **Live Crossfader (`Scene A <-> Scene B`)** or a **4-Corner XY Morph Pad** that interpolates four scenes simultaneously in two dimensions.\n\n### Controls & Workflow\n- **Capture & Recall Scenes**: Click any of the 8 scene buttons to recall or store a snapshot of cutoff, resonance, drive, FX depth, and timbre macros.\n- **Crossfader (`A <-> B`)**: Assign any scene to Slot A and Slot B, then slide the crossfader smoothly to morph every parameter together without a single click or audio pop.\n- **4-Corner XY Pad**: Drag the glowing puck anywhere inside the square to blend between Corners 1, 2, 3, and 4 continuously.\n\n### Provenance, Hardware Lineage & History\n- **Elektron Octatrack Crossfader (2011)**: Beloved by live techno and IDM performers for its silky optical crossfader that morphs dozens of parameters between Scene A and Scene B in one fluid gesture.\n- **Prophet VS (1986), Korg Wavestation (1990) & Korg Kaoss Pad (1999)**: Pioneered 2D joystick/touchpad vector morphing between four sonic corners.\n\n### Famous Tracks & Iconic Usage\n- **Elektron Live Techno Sets (Surgeon, Blawan, Karenn)** & **Radiohead / Muse (Korg Kaoss Pad)**: Iconic real-time scene morphing and 2D touch-pad performance sweeps.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp set-perf-master --scene-crossfade 0.5 --xy-x 0.75 --xy-y 0.35\n```\n\n---"}, {"id": "subpage-14-4-studio-mastering-bus", "title": "Subpage 14.4: Studio Mastering Bus", "body": "### What It Does (Plain English)\nBefore your audio leaves SynthCraft for your speakers, a club PA, or a `.wav` stem export, it passes through a dedicated 4-stage **Studio Mastering Bus** so your patches sound finished, wide, punchy, and clip-free right out of the box:\n1. **4-Band Mastering EQ**: Gentle musical shelving and bell bands (`Low`, `Low-Mid`, `High-Mid`, `High Air`) to polish tonal balance.\n2. **Sub-Bass Mono Maker (`< 120 Hz`)**: Forces deep sub-bass frequencies below 120 Hz strictly to the center mono channel while leaving mids and highs wide -- preventing muddy stereo phase cancellation on club subwoofers and vinyl records.\n3. **Mid/Side (M/S) Stereo Width**: Expand stereo pads past `100%` for huge widescreen immersion, or tighten leads toward mono for laser-focused punch.\n4. **True-Peak Brickwall Limiter**: Prevents digital clipping (`0.0 dBFS`) cleanly while raising perceived loudness to competitive streaming and club levels.\n\n### Controls & Workflow\n- **Enable Mastering Bus**: Toggle the master chain on and dial **Low/High EQ**, **Mono Bass (<120 Hz)**, **M/S Stereo Width (`0%` to `200%`)**, and **Limiter Ceiling / Drive**.\n- **Verify on Meters**: Keep an eye on the gain-reduction meter and Workbench 6 / Workbench 13 scopes so you add punch without squashing dynamics flat.\n\n### Provenance, Hardware Lineage & History\n- **Vinyl Lathe Elliptical EQ (Neumann VMS-70, 1960s-1970s)**: Cutting engineers discovered that stereo out-of-phase sub-bass literally threw the vinyl cutting stylus out of the groove, inventing the classic **elliptical mono-bass filter** still essential in every modern club mastering chain.\n- **Alan Blumlein's Mid/Side Stereo (1931) & Modern Lookahead Brickwall Limiters (Waves L1 1994, FabFilter Pro-L)**: Defined the clean, wide, loud polish of modern electronic and pop masters.\n\n### Famous Tracks & Iconic Usage\n- **Daft Punk -- \"Random Access Memories\" (2013, mastered by Bob Ludwig)** & **Deadmau5 -- \"4x4=12\" (2010)**: Benchmarks of crystal-clear sub-bass mono discipline, lush M/S stereo width, and punchy brickwall mastering.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp set-perf-master --master-enabled true --master-mono-bass true --master-stereo-width 1.25 --master-limiter-drive 0.35\n```"}]}, {"file": "15_pipe_organ.md", "id": "15_pipe_organ", "title": "Workbench 15: Cathedral Pipe Organ Console & Bach MIDI Depot", "intro": "The pipe organ is the **original additive synthesizer** -- invented more than 2,000 years ago and perfected in the cathedrals of Germany, Austria, and France. This workbench brings a complete 3-division *Werkprinzip* pipe organ console (16 authentic stop ranks, couplers, Swell box shutters, Crescendo roller, wind-chest chiff, bellows wind sag, Tremulant, and 5 historical temperaments) together with a direct **GrandOrgue / J.S. Bach MIDI Depot** importer.", "subpages": [{"id": "subpage-15-1-cathedral-organ-console-stop-jambs", "title": "Subpage 15.1: Cathedral Organ Console & Stop Jambs", "body": "### What It Does (Plain English)\nInstead of oscillators and cutoff knobs, a pipe organ builds sound by pulling out **Stop Drawknobs** -- each stop adds an entire rank of pipes tuned to a specific footage (`16'` = one octave below written pitch, `8'` = unison pitch, `4'` = one octave up, `2 2/3'` = musical twelfth, `2'` = two octaves up, `Mixtur IV` = shimmering Baroque harmonic chorus). SynthCraft models 16 classic stops across three divisions:\n- **I. Hauptwerk (Great Manual)**: `Bourdon 16'`, `Principal 8'`, `Rohrflote 8'`, `Oktave 4'`, `Quinte 2 2/3'`, `Superoktave 2'`, `Mixtur IV`, `Trompete 8'`.\n- **II. Schwellwerk (Swell Manual -- behind wooden Venetian shutters)**: `Gedackt 8'`, `Salicional 8'`, `Voix Celeste 8'` (tuned `+13.5 cents` sharp for heavenly slow cathedral beating), `Blockflote 4'`, `Oboe 8'`.\n- **Pedalwerk (Pedalboard)**: `Subbass 16'`, `Posaune 16'`, `Principalbass 8'`.\n\n### Controls & Workflow\n- **Pull Stops or Hit a Thumb Piston**: Click any ivory drawknob to pull/push individual ranks, or click one of the **8 Combination Thumb Pistons** (`pp Vespers Flute`, `p Romantic Voix Celeste`, `mf Baroque Chorale`, `f Silbermann Pleno`, `ff Cavaille-Coll Romantic`, `fff Bach Toccata Tutti`, `Solo Trompete Fanfare`, `General Cancel`).\n- **Engage Stephansdom Cathedral IR**: Click `Engage Stephansdom Cathedral IR` to wrap your organ pipes in soaring gothic stone reverberation immediately.\n- **Expression, Wind & Historical Temperament**: Sweep the **Swell Box Shutters** and **Crescendo Walze** (`pp -> Tutti`), dial **Wind-Chest Chiff** (initial air-edge transient when a pallet valve opens) and **Bellows Wind Pressure Sag**, engage the **Tremulant**, and switch between **Werckmeister III (1691 -- J.S. Bach's tuning)**, **Kirnberger III**, **Silbermann 1/6-Comma Meantone**, **Quarter-Comma Meantone**, and **12-TET**.\n\n### Provenance, Hardware Lineage & History\n- **Ctesibius of Alexandria (c. 250 BC)**: Invented the *Hydraulis* (water organ), the earliest keyboard instrument in human history.\n- **Arp Schnitger (1648-1719) & Gottfried Silbermann (1683-1753)**: Defined the German Baroque *Werkprinzip* organ architecture (clear, singing Principal choruses, sparkling Mixtures, and articulate mechanical tracker wind-chests) that J.S. Bach composed for in Leipzig, Weimar, and Freiberg.\n- **Aristide Cavaille-Coll (1811-1899)**: Created the French Romantic symphonic organ (Notre-Dame de Paris, Saint-Sulpice), introducing expressive enclosed Swell divisions, undulating *Voix Celeste* string ranks, and thunderous harmonic reeds.\n- **GrandOrgue & Hauptwerk (2000s-2026)**: Brought virtual cathedral pipe organs to home studios and church organists worldwide.\n\n### Famous Tracks & Iconic Usage\n- **J.S. Bach -- \"Toccata and Fugue in D minor\" (BWV 565) & \"Passacaglia and Fugue in C minor\" (BWV 582)**: The towering peaks of the Baroque *Pleno* and *Tutti* pipe organ repertoire.\n- **Charles-Marie Widor -- \"Toccata\" from Symphony No. 5 (1879)** & **Camille Saint-Saens -- Symphony No. 3 \"Organ\" (1886)**: Iconic showcases of the French Cavaille-Coll symphonic organ.\n- **Hans Zimmer -- \"Interstellar (Cornfield Chase / No Time for Caution)\" (2014)**: Recorded on the 1926 Harrison & Harrison pipe organ at Temple Church, London -- proving the pipe organ remains the mightiest bass synthesizer in cinema.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp load-patch --id organ_bach_toccata_tutti\n```\n\n---"}, {"id": "subpage-15-2-grandorgue-bach-midi-depot", "title": "Subpage 15.2: GrandOrgue Bach MIDI Depot", "body": "### What It Does (Plain English)\nConnects directly to your local **GrandOrgue / J.S. Bach `.mid` repertoire library** (automatically pointing to `D:\\Dev\\repos\\grandorgue-mcp\\midi_depot` when present, or any folder of `.mid` organ scores on your PC). Browse, filter by title (`jesu`, `prelud`, `fugue`, `air`, `chorale`), and import any piece straight into SynthCraft's 64-step sequencer with matched Cathedral Pipe Organ registration and Stephansdom reverb in one click.\n\n### Controls & Workflow\n- **Scan Your Organ Library**: Click **Scan Folder** to list every `.mid` file (automatically skipping macOS `._*` metadata files).\n- **Filter & Import**: Type a keyword to narrow down Bach chorales, preludes, or fugues, then click **Import to Organ** to load the score, activate the Cathedral Pipe Organ stops, and engage Stephansdom Cathedral IR reverb.\n- **Play Live Alongside GrandOrgue**: You can also export any SynthCraft organ pattern back out as a `.mid` file (Workbench 3) or route MIDI to standalone GrandOrgue via `grandorgue-mcp`.\n\n### Provenance, Hardware Lineage & History\n- **J.S. Bach's Orgelbuchlein, Clavier-Ubung III & Leipzig Chorales (1708-1750)**: The foundational body of pipe organ music -- and the primary repertoire preserved in open MIDI archives and `grandorgue-mcp`.\n\n### Famous Tracks & Iconic Usage\n- **J.S. Bach -- \"Jesu, Joy of Man's Desiring\" (BWV 147)**, **\"Air on the G String\" (BWV 1068)**, and **\"Wachet auf, ruft uns die Stimme\" (BWV 645)**: Timeless church organ masterworks ready to audition and study directly inside SynthCraft.\n\n### CLI & MCP Automation\n```powershell\nsynthcraft-mcp import-midi-file --path D:\\Dev\\repos\\grandorgue-mcp\\midi_depot\\11jesu.mid\n```"}]}];

const flatSubpages = [];
WORKBENCHES.forEach((wb, wIdx) => {
  wb.subpages.forEach((sub, sIdx) => {
    flatSubpages.push({ wIdx, sIdx, wb, sub });
  });
});

let currentView = { mode: "home", wIdx: 0, sIdx: 0 };

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function formatInline(s) {
  let out = escapeHtml(s);
  out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return out;
}

function renderMarkdownSections(md) {
  const parts = md.split(/\n(?=### )/);
  let html = "";
  for (const part of parts) {
    const lines = part.trim().split("\n");
    if (!lines.length) continue;
    let heading = "";
    let bodyLines = lines;
    if (lines[0].startsWith("### ")) {
      heading = lines[0].slice(4).trim();
      bodyLines = lines.slice(1);
    }
    let cardClass = "section-card";
    if (/Provenance|Lineage/i.test(heading)) cardClass += " lineage";
    else if (/Famous Tracks/i.test(heading)) cardClass += " tracks";
    else if (/CLI & MCP/i.test(heading)) cardClass += " cli";

    let inner = heading ? `<h3>${escapeHtml(heading)}</h3>` : "";
    let inCode = false;
    let codeBuf = [];
    let inUl = false;
    let inOl = false;

    const closeLists = () => {
      if (inUl) { inner += "</ul>"; inUl = false; }
      if (inOl) { inner += "</ol>"; inOl = false; }
    };

    for (const raw of bodyLines) {
      const line = raw.trimEnd();
      if (line.startsWith("```")) {
        closeLists();
        if (inCode) {
          const codeText = codeBuf.join("\n");
          inner += `<pre><button class="copy-btn" onclick="copyCode(this)">Copy</button><code>${escapeHtml(codeText)}</code></pre>`;
          codeBuf = [];
          inCode = false;
        } else {
          inCode = true;
        }
        continue;
      }
      if (inCode) { codeBuf.push(line); continue; }
      if (!line.trim()) { closeLists(); continue; }
      if (line.startsWith("- ")) {
        if (inOl) { inner += "</ol>"; inOl = false; }
        if (!inUl) { inner += "<ul>"; inUl = true; }
        inner += `<li>${formatInline(line.slice(2))}</li>`;
      } else if (/^\d+\.\s+/.test(line)) {
        if (inUl) { inner += "</ul>"; inUl = false; }
        if (!inOl) { inner += "<ol>"; inOl = true; }
        inner += `<li>${formatInline(line.replace(/^\d+\.\s+/, ""))}</li>`;
      } else {
        closeLists();
        inner += `<p>${formatInline(line)}</p>`;
      }
    }
    closeLists();
    html += `<section class="${cardClass}">${inner}</section>`;
  }
  return html;
}

window.copyCode = function(btn) {
  const code = btn.nextElementSibling.textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = "Copied!";
    setTimeout(() => { btn.textContent = "Copy"; }, 1400);
  });
};

function renderSidebar() {
  const tree = document.getElementById("sidebarTree");
  let html = `<button class="nav-home ${currentView.mode === "home" ? "active" : ""}" onclick="showHome()">Studio Atlas &amp; Overview</button>`;
  WORKBENCHES.forEach((wb, wIdx) => {
    html += `<div class="wb-group">
      <button class="wb-btn" onclick="showSubpage(${wIdx}, 0)">
        <span>${escapeHtml(wb.title.replace(/^Workbench\s+/, ""))}</span>
      </button>
      <div class="wb-subs">`;
    wb.subpages.forEach((sub, sIdx) => {
      const isActive = currentView.mode === "sub" && currentView.wIdx === wIdx && currentView.sIdx === sIdx;
      const shortTitle = sub.title.replace(/^Subpage\s+[\d.]+:\s*/, "");
      html += `<button class="sub-btn ${isActive ? "active" : ""}" onclick="showSubpage(${wIdx}, ${sIdx})">${escapeHtml(shortTitle)}</button>`;
    });
    html += `</div></div>`;
  });
  tree.innerHTML = html;
}

function showHome() {
  currentView = { mode: "home", wIdx: 0, sIdx: 0 };
  document.getElementById("searchInput").value = "";
  document.getElementById("breadcrumb").innerHTML = "<strong>SynthCraft Studio Handbook</strong> &middot; 14 Workbenches / 37 Subpages";
  let cards = WORKBENCHES.map((wb, wIdx) => {
    const tags = wb.subpages.map(s => `<span class="tag">${escapeHtml(s.title.replace(/^Subpage\s+[\d.]+:\s*/, ""))}</span>`).join("");
    return `<div class="wb-card" onclick="showSubpage(${wIdx}, 0)">
      <h3>${escapeHtml(wb.title)}</h3>
      <p>${formatInline(wb.intro)}</p>
      <div>${tags}</div>
    </div>`;
  }).join("");

  document.getElementById("content").innerHTML = `
    <div class="hero">
      <h2>SynthCraft Studio Handbook</h2>
      <p>Five decades of synthesizer history -- from 1970 Moog ladders, Don Buchla wavefolders, 1980s Roland TB-303 / TR-808 / TR-909, Korg M1 &amp; Yamaha DX7 to modern 2D FDTD physical modeling, 8x Wave Digital Filter circuits, Neural DDSP timbre transfer, and multi-core Genopatch -- explained in plain English with full hardware provenance and famous tracks.</p>
      <div class="stats">
        <div class="stat"><div class="num">14</div><div class="lbl">Hierarchical Workbenches</div></div>
        <div class="stat"><div class="num">${flatSubpages.length}</div><div class="lbl">Dedicated Subpage Guides</div></div>
        <div class="stat"><div class="num">60</div><div class="lbl">CLI &amp; MCP 2026-07-28 Tools</div></div>
        <div class="stat"><div class="num">CLAP + VCV</div><div class="lbl">Live DAW &amp; Rack 2 Verified</div></div>
      </div>
    </div>
    <h3>Explore All 14 Workbenches</h3>
    <div class="grid-cards">${cards}</div>
  `;
  renderSidebar();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function showSubpage(wIdx, sIdx) {
  currentView = { mode: "sub", wIdx, sIdx };
  const wb = WORKBENCHES[wIdx];
  const sub = wb.subpages[sIdx];
  const flatIdx = flatSubpages.findIndex(x => x.wIdx === wIdx && x.sIdx === sIdx);
  const prev = flatIdx > 0 ? flatSubpages[flatIdx - 1] : null;
  const next = flatIdx < flatSubpages.length - 1 ? flatSubpages[flatIdx + 1] : null;

  document.getElementById("breadcrumb").innerHTML =
    `${escapeHtml(wb.title)} &rsaquo; <strong>${escapeHtml(sub.title)}</strong>`;

  const pagerHtml = `<div class="pager">
    ${prev ? `<button onclick="showSubpage(${prev.wIdx}, ${prev.sIdx})">&larr; ${escapeHtml(prev.sub.title)}</button>` : "<span></span>"}
    ${next ? `<button onclick="showSubpage(${next.wIdx}, ${next.sIdx})">${escapeHtml(next.sub.title)} &rarr;</button>` : "<span></span>"}
  </div>`;

  document.getElementById("content").innerHTML = `
    <div class="subpage-header">
      <div class="kicker">${escapeHtml(wb.title)}</div>
      <h2>${escapeHtml(sub.title)}</h2>
    </div>
    ${renderMarkdownSections(sub.body)}
    ${pagerHtml}
  `;
  renderSidebar();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function runSearch(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    if (currentView.mode === "sub") showSubpage(currentView.wIdx, currentView.sIdx);
    else showHome();
    return;
  }
  const hits = flatSubpages.filter(item =>
    item.wb.title.toLowerCase().includes(q) ||
    item.sub.title.toLowerCase().includes(q) ||
    item.sub.body.toLowerCase().includes(q)
  );
  document.getElementById("breadcrumb").innerHTML = `Search results for <strong>"${escapeHtml(query)}"</strong> (${hits.length} matches)`;
  if (!hits.length) {
    document.getElementById("content").innerHTML = `<div class="section-card"><h3>No matches found</h3><p>Try searching for <code>303</code>, <code>808</code>, <code>Daft Punk</code>, <code>Buchla</code>, <code>DX7</code>, <code>OTT</code>, <code>vocoder</code>, or <code>MPE</code>.</p></div>`;
    return;
  }
  const html = hits.map(item => {
    const idx = item.sub.body.toLowerCase().indexOf(q);
    const start = Math.max(0, idx - 80);
    const snippet = item.sub.body.slice(start, start + 220).replace(/\n+/g, " ");
    return `<div class="search-hit" onclick="showSubpage(${item.wIdx}, ${item.sIdx})">
      <div class="meta">${escapeHtml(item.wb.title)}</div>
      <h4>${escapeHtml(item.sub.title)}</h4>
      <p>...${escapeHtml(snippet)}...</p>
    </div>`;
  }).join("");
  document.getElementById("content").innerHTML = html;
}

document.getElementById("searchInput").addEventListener("input", (e) => runSearch(e.target.value));
document.getElementById("homeBtn").addEventListener("click", showHome);
document.getElementById("themeBtn").addEventListener("click", () => {
  document.body.classList.toggle("light");
  document.getElementById("themeBtn").textContent =
    document.body.classList.contains("light") ? "Obsidian Dark" : "Daylight Mode";
});

showHome();
</script>
